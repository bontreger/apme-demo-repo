---
# Shared Ansible collections for ACL ready-to-use content.
# Install from repo root:
#   ansible-galaxy collection install -r collections/requirements.yml -p collections
# Or for user-wide lint/runtime:
#   ansible-galaxy collection install -r collections/requirements.yml

collections:
  - name: ansible.posix
    version: ">=2.1.0,<3.0.0"
  - name: ansible.windows
    version: ">=2.0.0,<3.0.0"
  - name: community.general
    version: ">=8.0.0,<13.0.0"
  - name: community.crypto
    version: ">=2.0.0,<3.0.0"
  - name: community.mysql
    version: ">=3.0.0,<4.0.0"
  - name: openstack.cloud
    version: ">=2.0.0,<3.0.0"
  - name: community.windows
    version: ">=2.0.0,<3.0.0"
  - name: chocolatey.chocolatey
    version: ">=1.5.0,<2.0.0"
  # infra.aap_configuration is NOT listed here -- it is only needed on the
  # workstation running controller_config/configure_aap.yml, not inside AAP.
  # Install it separately: ansible-galaxy collection install infra.aap_configuration

---
# Push ACL ready-to-implement content configuration to AAP controller.
#
# Prerequisites:
#   1. Copy site_config.yml.example to site_config.yml and fill in your values
#   2. Pre-create Machine credentials in AAP (see docs/aap-deployment-guide.md)
#   3. Install CaC collection:
#        ansible-galaxy collection install infra.aap_configuration
#
# Usage:
#   ansible-playbook controller_config/configure_aap.yml \
#     -e @controller_config/site_config.yml \
#     -e aap_token=YOUR_PAT_HERE

- name: Configure AAP controller for ACL ready-to-implement content
  hosts: localhost
  connection: local
  gather_facts: false

  vars_files:
    - inventories.yml
    - projects.yml
    - job_templates.yml

  vars:
    aap_configuration_async_retries: 120
    aap_configuration_async_delay: 2

  pre_tasks:
    - name: Validate required site configuration
      ansible.builtin.assert:
        that:
          - aap_hostname is defined
          - aap_token is defined
          - acl_project_scm_url is defined
          - acl_linux_credential is defined
        fail_msg: >-
          Missing required variables. Copy site_config.yml.example to
          site_config.yml, fill in your values, then run with:
          -e @controller_config/site_config.yml -e aap_token=YOUR_PAT
      tags: [always]

    - name: Filter job templates to selected subset (optional)
      ansible.builtin.set_fact:
        controller_templates: >-
          {{
            controller_templates
            | selectattr('playbook', 'in', selected_playbooks)
            | list
          }}
      when:
        - selected_playbooks is defined
        - selected_playbooks | length > 0
      tags: [always]

    - name: Validate Windows credential if Windows templates are included
      ansible.builtin.assert:
        that:
          - acl_windows_credential is defined
        fail_msg: >-
          One or more Windows templates are selected but acl_windows_credential
          is not defined. Add it to site_config.yml or remove Windows templates
          from selected_playbooks.
      when: controller_templates | selectattr('playbook', 'match', '^playbooks/win-') | list | length > 0
      tags: [always]

  roles:
    - role: infra.aap_configuration.controller_inventories
      when: controller_inventories is defined
      tags: [inventory]
    - role: infra.aap_configuration.controller_projects
      when: controller_projects is defined
      tags: [project]
    - role: infra.aap_configuration.controller_job_templates
      when: controller_templates is defined
      tags: [templates]

---
# Job templates for the pilot migration batch.
# Replace organization, inventory, credentials, and execution_environment
# placeholders before applying to a live controller.

controller_templates:
  - name: ACL_dns_bind_primary
    description: Deploy BIND primary (authoritative) DNS server
    organization: Default
    project: acl-ready-to-use-content
    inventory: acl_lab_inventory
    playbook: playbooks/dns-config/deploy_bind_primary_site.yml
    execution_environment: acl-ready-to-use-content-ee
    credentials:
      - acl_machine_credential
    survey_enabled: false

  - name: ACL_dns_bind_secondary
    description: Deploy BIND secondary (slave) DNS server
    organization: Default
    project: acl-ready-to-use-content
    inventory: acl_lab_inventory

---
- name: Validate VNC user parameter
  ansible.builtin.assert:
    that:
      - vnc_config_user is defined
      - vnc_config_user | length > 0
      - vnc_config_user is string
    fail_msg: "Invalid vnc_config_user. Must be a non-empty string."
    success_msg: "VNC user validated: {{ vnc_config_user }}"
  failed_when: false

- name: Validate VNC display number
  ansible.builtin.assert:
    that:
      - vnc_config_display_number is defined
      - (vnc_config_display_number | string | regex_search('^[0-9]+$')) is not none
      - vnc_config_display_number | int >= 1
      - vnc_config_display_number | int <= 99
    fail_msg: "Invalid vnc_config_display_number. Must be between 1 and 99."
    success_msg: "VNC display number validated: {{ vnc_config_display_number }}"
  failed_when: false

- name: Validate VNC geometry
  ansible.builtin.assert:
    that:
      - vnc_config_geometry is defined
      - (vnc_config_geometry | string | regex_search('^[0-9]+x[0-9]+$')) is not none
    fail_msg: "Invalid vnc_config_geometry. Must be WIDTHxHEIGHT (e.g. 1280x1024)."
    success_msg: "VNC geometry validated: {{ vnc_config_geometry }}"
  failed_when: false

- name: Validate VNC password
  ansible.builtin.assert:
    that:
      - vnc_config_password is defined
      - vnc_config_password | length >= 6
    fail_msg: "Invalid vnc_config_password. Must be at least 6 characters."
    success_msg: "VNC password validated (length check passed)"
  failed_when: false
  no_log: true

- name: Ensure VNC user exists
  ansible.builtin.user:
    name: "{{ vnc_config_user }}"
    state: present
    create_home: true
    shell: /bin/bash
  register: vnc_config_user_result
  failed_when: false

- name: Display user status
  ansible.builtin.debug:
    msg: "VNC user '{{ vnc_config_user }}' {{ 'created' if vnc_config_user_result.changed else 'already exists' }}"
  when: vnc_config_user_result is defined

- name: Install TigerVNC packages
  block:
    - name: Install TigerVNC server and desktop environment
      ansible.builtin.package:
        name: "{{ vnc_config_packages }}"
        state: present
      register: vnc_config_install_result
      failed_when: false

    - name: Display installation status
      ansible.builtin.debug:
        msg: >-
          TigerVNC packages installation
          {{ 'succeeded' if not vnc_config_install_result.failed else 'failed' }}
      when: vnc_config_install_result is defined
  rescue:
    - name: Handle package installation failure
      ansible.builtin.debug:
        msg: "Warning: Failed to install TigerVNC packages. Check repository configuration."

- name: Configure system-level VNC user mapping
  block:
    - name: Ensure /etc/tigervnc directory exists
      ansible.builtin.file:
        path: /etc/tigervnc
        state: directory
        owner: root
        group: root
        mode: "0755"
      failed_when: false

    - name: Set VNC user mapping in vncserver.users
      ansible.builtin.lineinfile:
        path: /etc/tigervnc/vncserver.users
        regexp: "^{{ ':' ~ vnc_config_display_number }}="
        line: "{{ ':' ~ vnc_config_display_number }}={{ vnc_config_user }}"
        create: true
        owner: root
        group: root
        mode: "0644"
      register: vnc_config_mapping_result
      failed_when: false

    - name: Display user mapping status
      ansible.builtin.debug:
        msg: "VNC user mapping {{ 'configured' if not vnc_config_mapping_result.failed else 'failed' }}"
      when: vnc_config_mapping_result is defined
  rescue:
    - name: Handle VNC user mapping failure
      ansible.builtin.debug:
        msg: "Warning: Failed to configure VNC user mapping."

- name: Configure system-level VNC default session
  block:
    - name: Write VNC default session config
      ansible.builtin.copy:
        content: "session={{ vnc_config_desktop_session }}"
        dest: /etc/tigervnc/vncserver-config-defaults
        owner: root
        group: root
        mode: "0644"
      register: vnc_config_session_result
      failed_when: false

    - name: Display session configuration status
      ansible.builtin.debug:
        msg: "VNC default session {{ 'configured' if not vnc_config_session_result.failed else 'failed' }}"
      when: vnc_config_session_result is defined
  rescue:
    - name: Handle VNC session configuration failure
      ansible.builtin.debug:
        msg: "Warning: Failed to configure VNC default session."

- name: Create user .vnc directory
  block:
    - name: Ensure .vnc directory exists for VNC user
      ansible.builtin.file:
        path: "/home/{{ vnc_config_user }}/.vnc"
        state: directory
        owner: "{{ vnc_config_user }}"
        group: "{{ vnc_config_user }}"
        mode: "0700"
      register: vnc_config_dir_result
      failed_when: false

    - name: Display directory creation status
      ansible.builtin.debug:
        msg: "VNC directory {{ 'created' if vnc_config_dir_result.changed else 'already exists' }}"
      when: vnc_config_dir_result is defined
  rescue:
    - name: Handle directory creation failure
      ansible.builtin.debug:
        msg: "Warning: Failed to create .vnc directory."

- name: Configure user VNC resolution
  block:
    - name: Write user VNC resolution config
      ansible.builtin.copy:
        content: "geometry={{ vnc_config_geometry }}"
        dest: "/home/{{ vnc_config_user }}/.vnc/config"
        owner: "{{ vnc_config_user }}"
        group: "{{ vnc_config_user }}"
        mode: "0600"
      register: vnc_config_resolution_result
      failed_when: false

    - name: Display resolution configuration status
      ansible.builtin.debug:
        msg: "VNC resolution {{ 'configured' if not vnc_config_resolution_result.failed else 'failed' }}"
      when: vnc_config_resolution_result is defined
  rescue:
    - name: Handle resolution configuration failure
      ansible.builtin.debug:
        msg: "Warning: Failed to configure VNC resolution. Default will be used."

- name: Set VNC password
  block:
    - name: Generate the VNC password file with vncpasswd
      # Run as root (the play's become) and feed the password on stdin, so the
      # secret never lands in a temp file or on the command line. vncpasswd -f
      # reads one password from stdin and writes the obfuscated passwd to
      # stdout, redirected into the user's .vnc directory. Writing as root then
      # chowning avoids an unprivileged become_user (which needs acl/setfacl)
      # and the earlier root-owned temp file the target user could not read.
      ansible.builtin.shell:
        cmd: "vncpasswd -f > /home/{{ vnc_config_user }}/.vnc/passwd"
        stdin: "{{ vnc_config_password }}"
      no_log: true
      register: vnc_config_passwd_result
      changed_when: vnc_config_passwd_result.rc == 0

    - name: Secure the VNC password file
      ansible.builtin.file:
        path: "/home/{{ vnc_config_user }}/.vnc/passwd"
        owner: "{{ vnc_config_user }}"
        group: "{{ vnc_config_user }}"
        mode: "0600"
  rescue:
    - name: Handle VNC password setup failure
      ansible.builtin.debug:
        msg: "Warning: Failed to set VNC password. Run 'vncpasswd' manually."
      no_log: true

- name: Manage VNC service
  block:
    - name: Stop existing VNC service if running
      ansible.builtin.systemd:
        name: "vncserver@:{{ vnc_config_display_number }}.service"
        state: stopped
      failed_when: false

    - name: Enable and start VNC service
      ansible.builtin.systemd:
        name: "vncserver@:{{ vnc_config_display_number }}.service"
        state: started
        enabled: true
        daemon_reload: true
      register: vnc_config_service_result
      failed_when: false

    - name: Display service status
      ansible.builtin.debug:
        msg: "VNC service {{ 'started and enabled' if not vnc_config_service_result.failed else 'failed to start' }}"
      when: vnc_config_service_result is defined

    - name: Verify VNC service status
      ansible.builtin.systemd:
        name: "vncserver@:{{ vnc_config_display_number }}.service"
      register: vnc_config_service_status
      failed_when: false

    - name: Display VNC service verification
      ansible.builtin.debug:
        msg:
          - "VNC service status: {{ vnc_config_service_status.status.ActiveState | default('unknown') }}"
          - "VNC service enabled: {{ vnc_config_service_status.status.UnitFileState | default('unknown') }}"
      when: vnc_config_service_status is defined
  rescue:
    - name: Handle VNC service management failure
      ansible.builtin.debug:
        msg: "Warning: Failed to manage VNC service. Check status manually."

- name: Configure firewall for VNC
  block:
    - name: Check if firewalld is running
      ansible.builtin.systemd:
        name: firewalld
      register: vnc_config_firewalld_status
      failed_when: false
      changed_when: false

    - name: Open VNC service port in firewall
      ansible.posix.firewalld:
        service: vnc-server
        permanent: true
        state: enabled
        immediate: true
      register: vnc_config_firewall_result
      failed_when: false
      when:
        - vnc_config_firewalld_status.status is defined
        - vnc_config_firewalld_status.status.ActiveState | default('') == "active"

    - name: Display firewall configuration status
      ansible.builtin.debug:
        msg: >-
          Firewall configuration
          {{ 'succeeded' if not vnc_config_firewall_result.failed
             else 'failed or firewalld not running' }}
      when: vnc_config_firewall_result is defined
  rescue:
    - name: Handle firewall configuration failure
      ansible.builtin.debug:
        msg: "Warning: Failed to configure firewall. VNC may not be accessible remotely."

- name: Display VNC connection information
  ansible.builtin.debug:
    msg:
      - "=========================================="
      - "VNC Service Configuration Completed"
      - "=========================================="
      - "User: {{ vnc_config_user }}"
      - "Host: {{ inventory_hostname }}"
      - "Display: :{{ vnc_config_display_number }}"
      - "TCP Port: {{ 5900 + vnc_config_display_number | int }}"
      - "Resolution: {{ vnc_config_geometry }}"
      - "Session: {{ vnc_config_desktop_session }}"
      - "=========================================="
      - "Connect: vncviewer {{ inventory_hostname }}:{{ vnc_config_display_number }}"
      - "=========================================="
  tags: [always]

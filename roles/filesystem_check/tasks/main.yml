# ============================================================================
# Role Tasks: Filesystem Check Role
# ============================================================================
#
# Description:
#   Core tasks for the filesystem_check role. This role performs read-only
#   filesystem health checks on target hosts and generates comprehensive
#   HTML reports.
#
# Workflow:
#   1. Validate input parameters and OS compatibility
#   2. Gather disk space usage information (df -h)
#   3. Gather inode usage information (df -i)
#   4. Check for xfs_scrub command availability
#   5. Perform read-only filesystem health checks on all mounted filesystems
#   6. Generate HTML report from template
#   7. Handle errors gracefully with block-rescue structure
#
# Safety:
#   - All filesystem checks are read-only (xfs_scrub, fsck -n)
#   - No modifications are made to filesystems
#   - Root filesystem is excluded by default (requires rescue mode)
#
# Author: Ansible Services Platform Team, Red Hat
# Version: 1.0.0
# Date: 2026-06-16
# License: Apache-2.0
#
# ============================================================================

---
# ========================================================================
# Input Parameter Validation
# ========================================================================
- name: Validate filesystem_check_exclude_fs_types parameter
  ansible.builtin.assert:
    that:
      - filesystem_check_exclude_fs_types is defined
      - filesystem_check_exclude_fs_types is iterable
    fail_msg: "filesystem_check_exclude_fs_types must be a list of filesystem types"
    success_msg: "Parameter validation passed: {{ filesystem_check_exclude_fs_types | length }} filesystem types to exclude"
  tags:
    - validation
    - always

- name: Validate filesystem_check_exclude_mount_points parameter
  ansible.builtin.assert:
    that:
      - filesystem_check_exclude_mount_points is defined
      - filesystem_check_exclude_mount_points is iterable
    fail_msg: "filesystem_check_exclude_mount_points must be a list of mount points"
    success_msg: "Parameter validation passed: {{ filesystem_check_exclude_mount_points | length }} mount points to exclude"
  tags:
    - validation
    - always

- name: Validate filesystem_check_report_dir parameter
  ansible.builtin.assert:
    that:
      - filesystem_check_report_dir is defined
      - filesystem_check_report_dir | length > 0
    fail_msg: "filesystem_check_report_dir must be a valid directory path"
    success_msg: "Report directory validated: {{ filesystem_check_report_dir }}"
  tags:
    - validation
    - always

- name: Display filesystem check configuration for debugging
  ansible.builtin.debug:
    msg:
      - "Excluded filesystem types: {{ filesystem_check_exclude_fs_types | join(', ') }}"
      - "Excluded mount points: {{ filesystem_check_exclude_mount_points | join(', ') }}"
      - "Report path: {{ filesystem_check_report_path }}"
  tags:
    - validation
    - debug

# ========================================================================
# OS Compatibility Validation
# ========================================================================
- name: Validate OS compatibility (RHEL 7/8/9/10)
  ansible.builtin.assert:
    that:
      - ansible_os_family == "RedHat"
      - ansible_distribution_major_version in ['7', '8', '9', '10']
    fail_msg: >-
      Unsupported operating system. This role supports RHEL-family 7/8/9/10.
      Current OS: {{ ansible_distribution }} {{ ansible_distribution_major_version }}
    success_msg: "OS compatibility check passed: {{ ansible_distribution }} {{ ansible_distribution_major_version }}"
  tags:
    - validation
    - always

- name: Display OS information for debugging
  ansible.builtin.debug:
    msg:
      - "Distribution: {{ ansible_distribution }}"
      - "Version: {{ ansible_distribution_version }}"
      - "Major Version: {{ ansible_distribution_major_version }}"
      - "Architecture: {{ ansible_architecture }}"
  tags:
    - validation
    - debug

# ========================================================================
# Gather Filesystem Information
# ========================================================================
- name: Gather disk space usage information (df -h)
  ansible.builtin.command: df -h
  register: filesystem_check_df_output
  changed_when: false
  failed_when: false
  tags:
    - gather
    - always

- name: Display disk space information for debugging
  ansible.builtin.debug:
    msg: "Disk space information collected successfully"
  when: filesystem_check_df_output.rc == 0
  tags:
    - gather
    - debug

- name: Gather inode usage information (df -i)
  ansible.builtin.command: df -i
  register: filesystem_check_df_inode_output
  changed_when: false
  failed_when: false
  tags:
    - gather
    - always

- name: Display inode information for debugging
  ansible.builtin.debug:
    msg: "Inode usage information collected successfully"
  when: filesystem_check_df_inode_output.rc == 0
  tags:
    - gather
    - debug

# ========================================================================
# Check for xfs_scrub Command Availability
# ========================================================================
- name: Check if xfs_scrub command exists
  ansible.builtin.command: which xfs_scrub
  register: filesystem_check_xfs_scrub_check
  changed_when: false
  failed_when: false
  tags:
    - precheck
    - always

- name: Display xfs_scrub availability for debugging
  ansible.builtin.debug:
    msg: "xfs_scrub command {{ 'available' if filesystem_check_xfs_scrub_check.rc == 0 else 'not available' }}"
  tags:
    - precheck
    - debug

# ========================================================================
# Perform Filesystem Health Checks
# ========================================================================
- name: Perform read-only filesystem health checks
  block:
    - name: Check filesystem health (read-only)
      ansible.builtin.command: >-
        {% if item.fstype == 'xfs' and filesystem_check_xfs_scrub_check.rc == 0 %}
        xfs_scrub {{ item.device }}
        {% elif item.fstype == 'xfs' and filesystem_check_xfs_scrub_check.rc != 0 %}
        echo "SKIPPED: xfs_scrub command not available"
        {% elif item.fstype in ['ext2', 'ext3', 'ext4'] %}
        fsck -n {{ item.device }}
        {% else %}
        echo "SKIPPED: Unsupported filesystem type {{ item.fstype }}"
        {% endif %}
      register: filesystem_check_check_results
      loop: "{{ ansible_mounts }}"
      when:
        - item.fstype not in filesystem_check_exclude_fs_types
        - item.mount not in filesystem_check_exclude_mount_points
      changed_when: false
      failed_when: false
      tags:
        - check
        - always

    - name: Display filesystem check summary for debugging
      ansible.builtin.debug:
        msg:
          - "Filesystem checks completed"
          - "Total check results: {{ filesystem_check_check_results.results | default([]) | length }}"
          - "Note: Some filesystems may have been excluded based on filesystem_check_exclude_fs_types and filesystem_check_exclude_mount_points"
      tags:
        - check
        - debug

  rescue:
    - name: Handle filesystem check errors
      ansible.builtin.debug:
        msg:
          - "⚠️ Warning: Some filesystem checks encountered errors"
          - "This is normal for read-only checks - review the report for details"
      tags:
        - check
        - always

# ========================================================================
# Generate Reports
# ========================================================================
- name: Ensure local report directory exists
  ansible.builtin.file:
    path: "{{ filesystem_check_report_dir }}"
    state: directory
    mode: "0755"
  tags:
    - report
    - always

- name: Generate plaintext filesystem check report
  ansible.builtin.template:
    src: report_summary.j2
    dest: "{{ filesystem_check_report_path }}"
    mode: "0644"
  tags:
    - report
    - always

- name: Read plaintext report for job output
  ansible.builtin.slurp:
    src: "{{ filesystem_check_report_path }}"
  register: __filesystem_check_report_slurp
  tags:
    - report
    - always

- name: Show filesystem check report in job output
  ansible.builtin.debug:
    msg: "{{ (__filesystem_check_report_slurp.content | b64decode).splitlines() }}"
  tags:
    - report
    - always

---
filesystem_check_exclude_fs_types:
  - tmpfs
  - devtmpfs
  - iso9660
  - squashfs
  - overlay
  - nfs
  - cifs
  - sysfs
  - proc
  - devfs
  - autofs

filesystem_check_exclude_mount_points:
  - /

filesystem_check_report_dir: /var/lib/ansible-reports
filesystem_check_report_path: >-
  {{ filesystem_check_report_dir }}/filesystem_check-{{ inventory_hostname }}.txt

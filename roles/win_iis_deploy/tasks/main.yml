---
- name: Ensure IIS Web Server is installed
  ansible.windows.win_feature:
    name: Web-Server
    state: present
    include_management_tools: true
  register: __win_iis_deploy_feature

- name: Reboot if the feature installation requires it
  ansible.windows.win_reboot:
  when:
    - __win_iis_deploy_feature.reboot_required
    - win_iis_deploy_reboot

- name: Open firewall for HTTP (port 80)
  community.windows.win_firewall_rule:
    name: IIS-HTTP-Inbound
    localport: 80
    action: allow
    direction: in
    protocol: tcp
    state: present
    enabled: true
  when: win_iis_deploy_firewall_http

- name: Open firewall for HTTPS (port 443)
  community.windows.win_firewall_rule:
    name: IIS-HTTPS-Inbound
    localport: 443
    action: allow
    direction: in
    protocol: tcp
    state: present
    enabled: true
  when: win_iis_deploy_firewall_https

- name: Ensure IIS service is started and set to automatic
  ansible.windows.win_service:
    name: W3SVC
    state: started
    start_mode: auto

- name: Create index page
  ansible.windows.win_copy:
    content: "{{ win_iis_deploy_index_content }}"
    dest: '{{ win_iis_deploy_webroot }}\index.html'

# Checked from the guest so the result reflects IIS, not the network path
# between the controller and the host.
- name: Verify IIS is responding
  ansible.windows.win_uri:
    url: http://localhost/
  register: __win_iis_deploy_http_check
  when: not ansible_check_mode

- name: Display IIS status
  ansible.builtin.debug:
    msg: "IIS responding with status {{ __win_iis_deploy_http_check.status_code }}"
  when: not ansible_check_mode

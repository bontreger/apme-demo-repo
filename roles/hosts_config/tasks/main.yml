---
# Hosts Configuration Role
# Standardizes /etc/hosts file from template server
- name: Backup current hosts file
  block:
    - name: Check for an existing backup
      ansible.builtin.stat:
        path: /etc/hosts.ansible.backup
      register: hosts_config_hosts_backup_stat
    - name: Backup hosts file
      ansible.builtin.copy:
        src: /etc/hosts
        dest: /etc/hosts.ansible.backup
        remote_src: true
        mode: "0644"
      register: hosts_config_hosts_backup
      when: not hosts_config_hosts_backup_stat.stat.exists
    - name: Display backup result
      ansible.builtin.debug:
        msg: "Hosts file backup completed"
  rescue:
    - name: Handle backup failure
      ansible.builtin.fail:
        msg: "Failed to backup hosts file"
- name: Initialize hosts template path
  ansible.builtin.set_fact:
    hosts_config_hosts_template_local_path: "/tmp/hosts.template.{{ inventory_hostname }}"
    hosts_config_hosts_template_fetched: false
- name: Fetch hosts file from template server
  block:
    - name: Fetch hosts file from template server
      ansible.builtin.fetch:
        src: "{{ system_config_template_server.hosts_file }}"
        dest: "{{ hosts_config_hosts_template_local_path }}"
        flat: true
      delegate_to: "{{ groups['template_servers'][0] | default(system_config_template_server.host) }}"
      run_once: true
      register: hosts_config_fetch_result
    - name: Update fetch status
      ansible.builtin.set_fact:
        hosts_config_hosts_template_fetched: true
      when: hosts_config_fetch_result is succeeded
    - name: Display fetch result
      ansible.builtin.debug:
        msg: "Hosts file fetched from template server to {{ hosts_config_hosts_template_local_path }}"
      when: hosts_config_fetch_result is succeeded
  rescue:
    - name: Handle fetch failure
      ansible.builtin.set_fact:
        hosts_config_hosts_template_fetched: false
    - name: Display fetch failure warning
      ansible.builtin.debug:
        msg: "Warning: Failed to fetch hosts file from template server. Hosts configuration will be skipped."
- name: Copy template hosts file to target server
  block:
    - name: Check if template file exists on control node
      ansible.builtin.stat:
        path: "{{ hosts_config_hosts_template_local_path }}"
      delegate_to: localhost
      become: false
      run_once: true
      register: hosts_config_hosts_template_stat
    - name: Copy template to remote location
      ansible.builtin.copy:
        src: "{{ hosts_config_hosts_template_local_path }}"
        dest: "/tmp/hosts.remote"
        mode: "0644"
      register: hosts_config_copy_result
      when:
        - hosts_config_hosts_template_fetched
        - hosts_config_hosts_template_stat.stat.exists
    - name: Display copy result
      ansible.builtin.debug:
        msg: "Template hosts file copied to target server"
      when:
        - hosts_config_hosts_template_fetched
        - hosts_config_copy_result is succeeded
    - name: Display copy skip message
      ansible.builtin.debug:
        msg: "Warning: Template file not found on control node. Skipping copy."
      when:
        - hosts_config_hosts_template_fetched
        - not hosts_config_hosts_template_stat.stat.exists
  rescue:
    - name: Handle copy failure
      ansible.builtin.debug:
        msg: "Warning: Failed to copy template hosts file. Hosts configuration will be skipped."
- name: Get local network information
  block:
    - name: Set local network facts
      ansible.builtin.set_fact:
        hosts_config_local_ip: "{{ ansible_default_ipv4.address }}"
        local_hostname: "{{ ansible_hostname }}"
        local_fqdn: "{{ ansible_fqdn }}"
    - name: Display local network information
      ansible.builtin.debug:
        msg:
          - "Local IP: {{ hosts_config_local_ip }}"
          - "Local Hostname: {{ local_hostname }}"
          - "Local FQDN: {{ local_fqdn }}"
  rescue:
    - name: Handle network information failure
      ansible.builtin.fail:
        msg: "Failed to get local network information"
- name: Merge hosts file
  block:
    - name: Check if template file exists on remote
      ansible.builtin.stat:
        path: /tmp/hosts.remote
      register: hosts_config_hosts_remote_stat
    - name: Read the template hosts file
      ansible.builtin.slurp:
        src: /tmp/hosts.remote
      register: hosts_config_hosts_template_content
      when: hosts_config_hosts_remote_stat.stat.exists
    # One deterministic write. Copying the template over /etc/hosts and then
    # re-appending the local entry meant both tasks reported changed forever,
    # because the template cannot contain this host's own address.
    - name: Write /etc/hosts from the template plus this host's entry
      ansible.builtin.copy:
        content: |
          {{ hosts_config_merged_hosts }}
          {{ hosts_config_local_ip }} {{ local_fqdn }} {{ local_hostname }}
        dest: /etc/hosts
        mode: "0644"
        backup: "{{ system_config_backup.enabled | default(true) }}"
      vars:
        hosts_config_merged_hosts: "{{ (hosts_config_hosts_template_content.content | b64decode).split('\n')
          | reject('search', hosts_config_local_ip) | join('\n') | trim }}"
      register: hosts_config_hosts_merge
      when: hosts_config_hosts_remote_stat.stat.exists
    - name: Display merge result
      ansible.builtin.debug:
        msg: "Hosts file merged from template"
      when: hosts_config_hosts_remote_stat.stat.exists
    - name: Skip merge when template not available
      ansible.builtin.debug:
        msg: "Warning: Template hosts file not available. Skipping hosts file merge."
      when: not hosts_config_hosts_remote_stat.stat.exists
  rescue:
    - name: Handle merge failure
      ansible.builtin.debug:
        msg: "Warning: Failed to merge hosts file. Please check template server connectivity."
- name: Add local entry to hosts file
  when: not hosts_config_hosts_remote_stat.stat.exists
  block:
    - name: Check if local entry exists
      ansible.builtin.command: grep -q "{{ hosts_config_local_ip }}" /etc/hosts
      register: hosts_config_local_entry_exists
      failed_when: false
      changed_when: false
    - name: Add local entry to hosts file
      ansible.builtin.lineinfile:
        path: /etc/hosts
        line: "{{ hosts_config_local_ip }} {{ local_fqdn }} {{ local_hostname }}"
        state: present
        backup: "{{ system_config_backup.enabled | default(true) }}"
      when: hosts_config_local_entry_exists.rc != 0
      register: hosts_config_local_entry_added
    - name: Display local entry result
      ansible.builtin.debug:
        msg: "Local entry {{ 'added' if hosts_config_local_entry_added.changed else 'already exists' }}"
  rescue:
    - name: Handle local entry failure
      ansible.builtin.debug:
        msg: "Warning: Failed to add local entry (non-critical)"
- name: Verify hosts file configuration
  block:
    - name: Display hosts file content
      ansible.builtin.command: cat /etc/hosts
      register: hosts_config_hosts_content
      changed_when: false
    - name: Display hosts file
      ansible.builtin.debug:
        msg: "{{ hosts_config_hosts_content.stdout_lines }}"
  rescue:
    - name: Handle verification failure
      ansible.builtin.debug:
        msg: "Warning: Hosts file verification encountered issues (non-critical)"
- name: Report hosts configuration summary
  block:
    - name: Display hosts configuration summary
      ansible.builtin.debug:
        msg:
          - "=== Hosts Configuration Summary ==="
          - >-
            {% if hosts_config_fetch_result is succeeded %}
            Hosts file fetched from template server
            {% else %}
            Failed to fetch hosts file from template server
            {% endif %}
          - >-
            {% if hosts_config_copy_result is defined and hosts_config_copy_result is succeeded %}
            ✅ Template file copied to target server{% elif hosts_config_fetch_result is succeeded %}⚠️  Warning: Template file copy may have failed
            {% else %}
            ⚠️  Warning: Hosts configuration skipped due to fetch failure
            {% endif %}
          - >-
            {% if hosts_config_hosts_merge is defined and hosts_config_hosts_merge is succeeded %}
            Hosts file merged successfully
            {% elif hosts_config_hosts_remote_stat.stat.exists is defined and hosts_config_hosts_remote_stat.stat.exists %}
            Warning: Hosts file merge may have failed
            {% else %}
            Warning: Hosts file merge was skipped
            {% endif %}

---
# Diagnosis threshold configuration
system_diagnosis_thresholds:
  error_packets: 10
  dropped_packets: 5
  overrun_packets: 3
  tcp_retransmit_rate: 0.1

# System log keywords to search for
system_diagnosis_log_keywords:
  - "bnx2x"
  - "e1000"
  - "igb"
  - "ixgbe"
  - "network"
  - "ethtool"
  - "link"
  - "carrier"

# Performance configuration
system_diagnosis_performance:
  max_log_lines: 1000
  timeout_seconds: 30
  retry_attempts: 3

# Cleanup configuration
system_diagnosis_cleanup_temp_files: true
system_diagnosis_backup_original_files: true

---
chronyd_rca_service: chronyd
chronyd_rca_package: chrony
chronyd_rca_ntp_server: pool.ntp.org
chronyd_rca_conf_path: /etc/chrony.conf
chronyd_rca_log_dir: /var/log/chrony
chronyd_rca_run_dir: /run/chrony
chronyd_rca_collect_journal_lines: 200
chronyd_rca_attempt_service_start: false

# Reporting
chronyd_rca_report_namespace: chronyd_rca
chronyd_rca_report_local_dir: "/var/lib/ansible-reports/{{ chronyd_rca_report_namespace }}"
chronyd_rca_report_job_id: "{{ awx_job_id | default(ansible_date_time.epoch) }}"
chronyd_rca_report_text_path: >-
  {{ chronyd_rca_report_local_dir }}/{{ inventory_hostname }}-{{ chronyd_rca_report_job_id }}.txt

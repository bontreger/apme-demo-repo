---
chronyd_rca_service: chronyd
chronyd_rca_package: chrony
chronyd_rca_ntp_server: pool.ntp.org
chronyd_rca_conf_path: /etc/chrony.conf
chronyd_rca_log_dir: /var/log/chrony
chronyd_rca_run_dir: /run/chrony
chronyd_rca_collect_journal_lines: 200
chronyd_rca_attempt_service_start: false

chronyd_rca_report_dir: /var/lib/ansible-reports
chronyd_rca_report_path: >-
  {{ chronyd_rca_report_dir }}/chronyd_rca-{{ inventory_hostname }}.txt

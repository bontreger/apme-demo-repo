---
- name: Ensure report directory exists
  ansible.builtin.file:
    path: "{{ pcp_analysis_report_dir }}"
    state: directory
    mode: "0755"

- name: Generate PCP performance report
  ansible.builtin.template:
    src: pcp_report.md.j2
    dest: "{{ pcp_analysis_report_path }}"
    mode: "0644"

- name: Read plaintext report for job output
  ansible.builtin.slurp:
    src: "{{ pcp_analysis_report_path }}"
  register: __pcp_analysis_report_slurp

- name: Show PCP performance report in job output
  ansible.builtin.debug:
    msg: "{{ (__pcp_analysis_report_slurp.content | b64decode).splitlines() }}"

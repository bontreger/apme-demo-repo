---
# Report configuration
report_namespace: network_diagnosis # noqa: var-naming[no-role-prefix]
report_local_dir: "/var/lib/ansible-reports/{{ report_namespace }}" # noqa: var-naming[no-role-prefix]
report_job_id: "{{ awx_job_id | default(ansible_date_time.epoch) }}" # noqa: var-naming[no-role-prefix]
report_text_path: >- # noqa: var-naming[no-role-prefix]
  {{ report_local_dir }}/{{ inventory_hostname }}-{{ report_job_id }}.txt
report_output_dir: "{{ report_local_dir }}" # noqa: var-naming[no-role-prefix]
report_filename: "{{ inventory_hostname }}-{{ report_job_id }}.txt" # noqa: var-naming[no-role-prefix]

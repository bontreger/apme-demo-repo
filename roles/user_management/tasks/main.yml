---
# User Management Role
# Creates admin user with sudo privileges and session persistence
- name: Initialize user management status
  ansible.builtin.set_fact:
    user_management_errors: []
    user_management_user_created: false
    user_management_sudo_configured: false
    user_management_session_enabled: false
- name: Create admin user
  block:
    - name: Create admin user
      ansible.builtin.user:
        name: "{{ user_management_admin_user }}"
        password: "{{ user_management_admin_password | password_hash('sha512') }}"
        update_password: on_create
        shell: /bin/bash
        create_home: true
        state: present
      register: user_management_user_creation
      no_log: true
    - name: Update user creation status
      ansible.builtin.set_fact:
        user_management_user_created: true
    - name: Display user creation result
      ansible.builtin.debug:
        msg: "Admin user '{{ user_management_admin_user }}' {{ 'created' if user_management_user_creation.changed else 'already exists' }}"
  rescue:
    - name: Record user creation failure
      ansible.builtin.set_fact:
        user_management_errors: "{{ user_management_errors + ['Failed to create admin user: ' + user_management_admin_user] }}"
    - name: Display user creation failure warning
      ansible.builtin.debug:
        msg: "Warning: Failed to create admin user: {{ user_management_admin_user }}. Continuing with other configurations."
- name: Configure sudo privileges
  block:
    - name: Add sudo rule for admin user
      ansible.builtin.lineinfile:
        path: /etc/sudoers.d/{{ user_management_admin_user }}
        line: "{{ user_management_admin_user }} ALL=(ALL) NOPASSWD: ALL"
        state: present
        create: true
        mode: "0440"
        validate: "visudo -cf %s"
      register: user_management_sudo_config
      failed_when: false
    - name: Update sudo configuration status
      ansible.builtin.set_fact:
        user_management_sudo_configured: true
      when: user_management_sudo_config is succeeded
    - name: Display sudo configuration result
      ansible.builtin.debug:
        msg: "Sudo privileges {{ 'configured' if user_management_sudo_config.changed else 'already configured' }} for user '{{ user_management_admin_user }}'"
      when: user_management_sudo_config is succeeded
  rescue:
    - name: Record sudo configuration failure
      ansible.builtin.set_fact:
        user_management_errors: "{{ user_management_errors + ['Failed to configure sudo privileges for user: ' + user_management_admin_user] }}"
    - name: Display sudo configuration failure warning
      ansible.builtin.debug:
        msg: "Warning: Failed to configure sudo privileges for user: {{ user_management_admin_user }}. Continuing with other configurations."
- name: Enable user session persistence
  block:
    - name: Check whether lingering is already enabled
      ansible.builtin.stat:
        path: /var/lib/systemd/linger/{{ user_management_admin_user }}
      register: user_management_linger_stat
    - name: Enable session lingering for the admin user
      ansible.builtin.command: loginctl enable-linger {{ user_management_admin_user }}
      register: user_management_linger_result
      changed_when: true
      failed_when: false
      when: not user_management_linger_stat.stat.exists
    - name: Update session persistence status
      ansible.builtin.set_fact:
        user_management_session_enabled: true
      when: user_management_linger_result is succeeded
    - name: Display session persistence result
      ansible.builtin.debug:
        msg: "User session persistence {{ 'enabled' if user_management_linger_result.changed | default(false) else 'already enabled' }}"
      when: user_management_linger_result is succeeded
  rescue:
    - name: Handle session persistence failure
      ansible.builtin.debug:
        msg: "Warning: Failed to enable user session persistence (non-critical)"
- name: Verify user creation
  block:
    - name: Check user existence
      ansible.builtin.command: id {{ user_management_admin_user }}
      register: user_management_user_check
      changed_when: false
      failed_when: false
    - name: Display user information
      ansible.builtin.debug:
        msg: "User '{{ user_management_admin_user }}' verification: {{ user_management_user_check.stdout }}"
      when: user_management_user_check is succeeded
  rescue:
    - name: Handle verification failure
      ansible.builtin.debug:
        msg: "Warning: User verification encountered issues (non-critical)"
- name: Report user management summary
  block:
    - name: Display user management summary
      ansible.builtin.debug:
        msg:
          - "=== User Management Summary ==="
          - "{% if user_management_user_created %}✅ Admin user created/verified{% else %}❌ Failed to create admin user{% endif %}"
          - "{% if user_management_sudo_configured %}✅ Sudo privileges configured{% else %}❌ Failed to configure sudo privileges{% endif %}"
          - "{% if user_management_session_enabled %}✅ Session persistence enabled{% else %}⚠️  Session persistence not enabled (non-critical){% endif %}"
          - >-
            {% if user_management_errors | length > 0 %}
            ⚠️  Errors encountered: {{ user_management_errors | join('; ') }}
            {% else %}
            ✅ All user management tasks completed successfully
            {% endif %}

---
- name: Gather package facts
  ansible.builtin.package_facts:
    manager: auto
  tags: [precheck, always]

- name: Verify httpd is installed
  ansible.builtin.debug:
    msg: "httpd package not installed (required for protocol={{ yum_repo_config_protocol }}). Install httpd and re-run."
  failed_when:
    - yum_repo_config_protocol in ['http', 'https']
    - "'httpd' not in ansible_facts.packages"
  tags: [precheck, always]

- name: Verify vsftpd is installed
  ansible.builtin.debug:
    msg: "vsftpd package not installed (required for protocol=ftp). Install vsftpd and re-run."
  failed_when:
    - yum_repo_config_protocol == 'ftp'
    - "'vsftpd' not in ansible_facts.packages"
  tags: [precheck, always]

- name: Ensure document root directory exists
  ansible.builtin.file:
    path: "{{ yum_repo_config_document_root }}"
    state: directory
    mode: "0755"
  tags: [setup, always]

- name: Ensure mount path directory exists
  ansible.builtin.file:
    path: "{{ yum_repo_config_mount_path }}"
    state: directory
    mode: "0755"
  tags: [setup, always]

- name: Mount ISO read-only
  ansible.posix.mount:
    path: "{{ yum_repo_config_mount_path }}"
    src: "{{ yum_repo_config_iso_path }}"
    fstype: iso9660
    opts: ro
    state: mounted
  when: yum_repo_config_source == 'iso'
  tags: [mount, always]

- name: Create repository subdirectory under document root
  ansible.builtin.file:
    path: "{{ yum_repo_config_document_root }}/{{ yum_repo_config_relative_path }}"
    state: directory
    mode: "0755"
  tags: [setup, always]

- name: Synchronize repository files from mount to document root
  ansible.posix.synchronize:
    src: "{{ yum_repo_config_mount_path }}/"
    dest: "{{ yum_repo_config_document_root }}/{{ yum_repo_config_relative_path }}"
    recursive: true
    delete: false
  delegate_to: "{{ inventory_hostname }}"
  tags: [sync, always]

- name: Unmount ISO
  ansible.posix.mount:
    path: "{{ yum_repo_config_mount_path }}"
    state: unmounted
  when: yum_repo_config_source == 'iso'
  tags: [cleanup, always]

- name: Configure httpd ServerName
  ansible.builtin.lineinfile:
    path: /etc/httpd/conf/httpd.conf
    regexp: "^#?ServerName"
    line: "ServerName {{ inventory_hostname }}:80"
    backup: true
  when: yum_repo_config_protocol in ['http', 'https']
  tags: [service, always]

- name: Restart httpd service
  ansible.builtin.service:
    name: httpd
    state: restarted
  when: yum_repo_config_protocol in ['http', 'https']
  tags: [service, always]

- name: Restart vsftpd service
  ansible.builtin.service:
    name: vsftpd
    state: restarted
  when: yum_repo_config_protocol == 'ftp'
  tags: [service, always]

- name: Ensure firewalld service is running
  ansible.builtin.service:
    name: firewalld
    state: started
    enabled: true
  tags: [firewall, always]

- name: Allow HTTP traffic through firewall
  ansible.posix.firewalld:
    port: "80/tcp"
    permanent: true
    state: enabled
    immediate: true
  when: yum_repo_config_protocol == 'http'
  tags: [firewall, always]

- name: Allow HTTPS traffic through firewall
  ansible.posix.firewalld:
    port: "443/tcp"
    permanent: true
    state: enabled
    immediate: true
  when: yum_repo_config_protocol == 'https'
  tags: [firewall, always]

- name: Allow FTP traffic through firewall
  ansible.posix.firewalld:
    service: ftp
    permanent: true
    state: enabled
    immediate: true
  when: yum_repo_config_protocol == 'ftp'
  tags: [firewall, always]

- name: Set SELinux boolean for httpd network connectivity
  ansible.builtin.command:
    cmd: setsebool -P httpd_can_network_connect on
  when: yum_repo_config_protocol in ['http', 'https']
  register: _yum_repo_config_selinux_network
  changed_when: _yum_repo_config_selinux_network.rc == 0
  failed_when: _yum_repo_config_selinux_network.rc != 0
  tags: [selinux, always]

- name: Set file permissions for repository content
  ansible.builtin.file:
    path: "{{ yum_repo_config_document_root }}/{{ yum_repo_config_relative_path }}"
    mode: "0755"
    owner: root
    group: root
    recurse: true
  when: yum_repo_config_protocol in ['http', 'https']
  tags: [permissions, always]

- name: Apply SELinux file context using restorecon
  ansible.builtin.command:
    cmd: restorecon -R "{{ yum_repo_config_document_root }}/{{ yum_repo_config_relative_path }}"
  when: yum_repo_config_protocol in ['http', 'https']
  register: _yum_repo_config_restorecon
  changed_when: _yum_repo_config_restorecon.rc == 0
  failed_when: _yum_repo_config_restorecon.rc != 0
  tags: [selinux, always]

# Fallback if restorecon policy is not configured for this path
- name: Apply httpd SELinux file context using chcon (fallback)
  ansible.builtin.command:
    cmd: chcon -R -t httpd_sys_content_t "{{ yum_repo_config_document_root }}/{{ yum_repo_config_relative_path }}"
  when:
    - yum_repo_config_protocol in ['http', 'https']
    - _yum_repo_config_restorecon.rc != 0
  register: _yum_repo_config_chcon
  changed_when: _yum_repo_config_chcon.rc == 0
  failed_when: _yum_repo_config_chcon.rc != 0
  tags: [selinux, always]

- name: Apply vsftpd SELinux file context
  ansible.builtin.command:
    cmd: chcon -R -t public_content_t "{{ yum_repo_config_document_root }}/{{ yum_repo_config_relative_path }}"
  when: yum_repo_config_protocol == 'ftp'
  register: _yum_repo_config_ftp_context
  changed_when: _yum_repo_config_ftp_context.rc == 0
  failed_when: _yum_repo_config_ftp_context.rc != 0
  tags: [selinux, always]

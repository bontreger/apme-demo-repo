---
- name: Validate OS compatibility (RHEL 8/9 only)
  ansible.builtin.assert:
    that:
      - ansible_distribution == 'RedHat'
      - ansible_distribution_major_version in ['8', '9']
    fail_msg: >-
      Unsupported operating system. This role is only available for RHEL 8/9.
      Current OS: {{ ansible_distribution }} {{ ansible_distribution_major_version }}
    success_msg: "OS compatibility check passed: {{ ansible_distribution }} {{ ansible_distribution_major_version }}"
  tags: [validation, always]

- name: Include server tasks
  ansible.builtin.include_tasks: server.yml
  when: >-
    (yum_repo_config_mode | default('')) == 'server' or
    (yum_repo_config_mode is not defined and inventory_hostname in groups[yum_repo_config_server_group] | default([]))
  tags: [server, always]

- name: Include client tasks
  ansible.builtin.include_tasks: client.yml
  when: >-
    (yum_repo_config_mode | default('')) == 'client' or
    (yum_repo_config_mode is not defined and inventory_hostname in groups[yum_repo_config_client_group] | default([]))
  tags: [client, always]

---
- name: Ensure local report directory exists
  ansible.builtin.file:
    path: "{{ os_info_report_dir }}"
    state: directory
    mode: "0755"

- name: Generate plaintext OS information report
  ansible.builtin.template:
    src: os_info_report_summary.j2
    dest: "{{ os_info_report_path }}"
    mode: "0644"

- name: Read plaintext OS information report for job output
  ansible.builtin.slurp:
    src: "{{ os_info_report_path }}"
  register: __os_info_report_slurp

- name: Show OS information report in job output
  ansible.builtin.debug:
    msg: "{{ (__os_info_report_slurp.content | b64decode).splitlines() }}"

---
# roles/openstack_vm_manager/tasks/floating_ip_manage.yml

- name: Set command prefix in openstack client pod
  ansible.builtin.set_fact:
    openstack_vm_manager_oc_os_argv:
      - oc
      - exec
      - -n
      - openstack
      - openstackclient
      - --
      - openstack

# ==========================================================
# Floating IP (Assign)
# ==========================================================
- name: "Assign floating ip to vms"
  ansible.builtin.command:
    argv: >-
      {{ openstack_vm_manager_oc_os_argv +
         ['server', 'add', 'floating', 'ip', item.vm_name, item.fip_address] }}
  loop: "{{ floating_ip_list }}"
  when: operation == 'fip_manage' and action_type == 'assign'
  register: openstack_vm_manager_fip_assign_res
  changed_when: openstack_vm_manager_fip_assign_res.rc == 0
  failed_when:
    - openstack_vm_manager_fip_assign_res.rc != 0
    - "'already has' not in openstack_vm_manager_fip_assign_res.stderr"

# ==========================================================
# Floating IP (Unassign)
# ==========================================================
- name: "Unassign floating ip from vms"
  ansible.builtin.command:
    argv: >-
      {{ openstack_vm_manager_oc_os_argv +
         ['server', 'remove', 'floating', 'ip', item.vm_name, item.fip_address] }}
  loop: "{{ floating_ip_list }}"
  when: operation == 'fip_manage' and action_type == 'unassign'
  register: openstack_vm_manager_fip_unassign_res
  changed_when: openstack_vm_manager_fip_unassign_res.rc == 0
  failed_when: false

# ==========================================================
# Verify status
# ==========================================================
- name: "Check floating ip assign status"
  ansible.builtin.command:
    argv: "{{ openstack_vm_manager_oc_os_argv + ['floating', 'ip', 'list', '-f', 'json'] }}"
  register: openstack_vm_manager_fip_raw_status
  when: operation == 'fip_manage' and action_type == 'query'
  run_once: true
  changed_when: false

- name: "Print floating ip assignment report"
  ansible.builtin.debug:
    msg: |
      ----------------------------------------------------------------
      Floating IP status summary:
      {% for fip in openstack_vm_manager_fip_raw_status.stdout | from_json %}
        - IP: {{ fip['Floating IP Address'] }}
          Status: {{ fip.Status }}
          Private_Network_Mapping: {{ fip['Fixed IP Address'] | default('Not assigned') }}
          On_VM_Port: {{ fip.Port | default('N/A') }}
      {% endfor %}
      ----------------------------------------------------------------
  when: operation == 'fip_manage' and action_type == 'query'

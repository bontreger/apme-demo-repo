---
# roles/openstack_vm_manager/tasks/inspection.yml

- name: Set command prefix in openstack client pod
  ansible.builtin.set_fact:
    openstack_vm_manager_oc_os_argv:
      - oc
      - exec
      - -n
      - openstack
      - openstackclient
      - --
      - openstack

- name: "Inspect and get vm metadata with json format"
  ansible.builtin.command:
    argv: "{{ openstack_vm_manager_oc_os_argv + ['server', 'show', item.vm_name, '-f', 'json'] }}"
  loop: "{{ vm_inspection_list | default(volume_manage_list) }}"
  register: openstack_vm_manager_vm_raw_data
  when: operation == 'inspection'
  changed_when: false

- name: "Inspect and print info from vms"
  vars:
    info: "{{ item.stdout | from_json }}"
    pwr_map: { "0": "NO STATE", "1": "RUNNING", "3": "PAUSED", "4": "SHUTDOWN" }
  ansible.builtin.debug:
    msg:
      - "================================================================"
      - "Virtual_Machine_Name : {{ info.name }}"
      - "Instance_Status   : {{ info.status }} ({{ pwr_map[info.power_state | string] | default('OTHER') }})"
      - "Flavor_information   : {{ info.flavor }}"
      - "----------------------------------------------------------------"
      - "Network_Address   : {{ info.addresses | string }}"
      - "Security_Group     : {{ info.security_groups | map(attribute='name') | list | join(', ') }}"
      - "----------------------------------------------------------------"
      - "Volume_Attached     : {{ info.volumes_attached | map(attribute='id') | list | default('None') }}"
      - "Hypervisor : {{ info['OS-EXT-SRV-ATTR:hypervisor_hostname'] | default('N/A') }}"
      - "================================================================"
  loop: "{{ openstack_vm_manager_vm_raw_data.results }}"
  when: operation == 'inspection'
  loop_control:
    label: "{{ item.item.vm_name }}"

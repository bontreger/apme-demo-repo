---
# roles/openstack_vm_manager/tasks/setup_env.yml

- name: Check and upload RHEL 9 vm image
  openstack.cloud.image:
    auth: "{{ vault_os_auth }}"
    verify: false
    name: "rhel9.6"
    container_format: bare
    disk_format: qcow2
    state: present
    filename: "/home/lab-user/osp-automation/rhel-9.6-x86_64-kvm.qcow2"
  register: openstack_vm_manager_image_upload

- name: Make sure SSH key pair existed on bastion server
  ansible.builtin.user:
    name: "{{ lookup('env', 'USER') }}"
    generate_ssh_key: true

    ssh_key_bits: 2048
    ssh_key_file: .ssh/id_rsa

- name: Register bastion server SSH key pair to OpenStack
  openstack.cloud.keypair:
    auth: "{{ vault_os_auth }}"
    verify: false
    name: "ansible_key"
    public_key_file: "{{ lookup('env', 'HOME') }}/.ssh/id_rsa.pub"
    state: present

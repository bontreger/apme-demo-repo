---
# roles/openstack_vm_manager/tasks/volume_manage.yml

- name: Set command prefix in openstack client pod
  ansible.builtin.set_fact:
    openstack_vm_manager_oc_os_argv:
      - oc
      - exec
      - -n
      - openstack
      - openstackclient
      - --
      - openstack

# ==========================================================
# Check current volume attachment status
# ==========================================================
- name: "Check volume attachment status"
  ansible.builtin.command:
    argv: >-
      {{ openstack_vm_manager_oc_os_argv +
         ['volume', 'show', item.1, '-f', 'value', '-c', 'status'] }}
  loop: "{{ volume_manage_list | subelements('volumes') }}"
  register: openstack_vm_manager_volume_precheck
  when: operation == 'volume_manage' and action_type == 'attach'
  changed_when: false

# ==========================================================
# Attach volume only when volume is available
# ==========================================================
- name: "Attach multi volume to vms"
  ansible.builtin.command:
    argv: >-
      {{ openstack_vm_manager_oc_os_argv +
         ['server', 'add', 'volume', item.0.vm_name, item.1] }}
  loop: "{{ volume_manage_list | subelements('volumes') }}"
  loop_control:
    index_var: idx
  when:
    - operation == 'volume_manage'
    - action_type == 'attach'
    - openstack_vm_manager_volume_precheck.results[idx].stdout == 'available'
  changed_when: true

# ==========================================================
# Detach volume when it is in in-use status
# ==========================================================
- name: "Check volume status before detaching"
  ansible.builtin.command:
    argv: >-
      {{ openstack_vm_manager_oc_os_argv +
         ['volume', 'show', item.1, '-f', 'value', '-c', 'status'] }}
  loop: "{{ volume_manage_list | subelements('volumes') }}"
  register: openstack_vm_manager_volume_detach_check
  when: operation == 'volume_manage' and action_type == 'detach'
  changed_when: false

- name: "Detach volumes from specified vms"
  ansible.builtin.command:
    argv: >-
      {{ openstack_vm_manager_oc_os_argv +
         ['server', 'remove', 'volume', item.0.vm_name, item.1] }}
  loop: "{{ volume_manage_list | subelements('volumes') }}"
  loop_control:
    index_var: idx
  when:
    - operation == 'volume_manage'
    - action_type == 'detach'
    - openstack_vm_manager_volume_detach_check.results[idx].stdout == 'in-use'
  changed_when: true

# ==========================================================
# Check status
# ==========================================================
- name: "Check volume attachment status"
  ansible.builtin.command:
    argv: >-
      {{ openstack_vm_manager_oc_os_argv +
         ['volume', 'show', item.1, '-f', 'value', '-c', 'attachments'] }}
  loop: "{{ volume_manage_list | subelements('volumes') }}"
  register: openstack_vm_manager_vol_detail
  when: operation == 'volume_manage' and action_type == 'query'
  failed_when: false
  changed_when: false

- name: "Check and print report of volume attachment status"
  ansible.builtin.debug:
    msg:
      - "----------------------------------------------------------------"
      - "Virtual_Machine_Name : {{ item.item.0.vm_name }}"
      - "Cloud_Volume_Name : {{ item.item.1 }}"
      - "Attach_Status   : {{ item.stdout | from_yaml | default('Not attached', true) }}"
      - "----------------------------------------------------------------"
  loop: "{{ openstack_vm_manager_vol_detail.results }}"
  when: operation == 'volume_manage' and action_type == 'query'
  loop_control:
    label: "{{ item.item.1 }}"

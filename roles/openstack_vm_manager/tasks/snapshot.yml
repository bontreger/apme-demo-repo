---
# roles/openstack_vm_manager/tasks/snapshot.yml

- name: Set command prefix in openstack client pod
  ansible.builtin.set_fact:
    openstack_vm_manager_oc_os_argv:
      - oc
      - exec
      - -n
      - openstack
      - openstackclient
      - --
      - openstack

# ==========================================================
# Action 1：Create snapshot
# ==========================================================
- name: "Create snapshot for vms"
  ansible.builtin.command:
    argv: >-
      {{ openstack_vm_manager_oc_os_argv +
         ['server', 'image', 'create', '--name', item.snap_name, item.vm_name] }}
  loop: "{{ vm_snapshot_list }}"
  when: operation == 'snapshot' and action_type == 'create'
  changed_when: true

# ==========================================================
# Action 2：Query snapshot
# ==========================================================
- name: "Get UUID of snapshots"
  ansible.builtin.command:
    argv: "{{ openstack_vm_manager_oc_os_argv + ['server', 'show', item.vm_name, '-f', 'value', '-c', 'id'] }}"
  loop: "{{ vm_snapshot_list }}"
  register: openstack_vm_manager_vm_uuids
  when: operation == 'snapshot' and action_type == 'query'
  changed_when: false

- name: "Check snapshot UUID which associate with image assets"
  ansible.builtin.command:
    argv: >-
      {{ openstack_vm_manager_oc_os_argv +
         ['image', 'list', '--property', 'instance_uuid=' + item.stdout, '-f', 'json'] }}
  loop: "{{ openstack_vm_manager_vm_uuids.results }}"
  register: openstack_vm_manager_all_snapshots
  when: operation == 'snapshot' and action_type == 'query' and not item.skipped | default(false)
  changed_when: false

- name: "Check and print snapshot list of specified vms"
  ansible.builtin.debug:
    msg:
      - "Virtual_Machine_Name: {{ item.item.item.vm_name }}"
      - "Snapshot_list_of_vm: {{ item.stdout | from_json | map(attribute='Name') | list }}"
  loop: "{{ openstack_vm_manager_all_snapshots.results }}"
  when: operation == 'snapshot' and action_type == 'query' and not item.skipped | default(false)

# ==========================================================
# Action 3 & 4：Delete and Revert snapshot
# ==========================================================
- name: "Delete spcified snapshot"
  ansible.builtin.command:
    argv: "{{ openstack_vm_manager_oc_os_argv + ['image', 'delete', item.snap_name] }}"
  loop: "{{ vm_snapshot_list }}"
  when: operation == 'snapshot' and action_type == 'delete'
  changed_when: true

- name: "Revert to specifed snapshot"
  ansible.builtin.command:
    argv: >-
      {{ openstack_vm_manager_oc_os_argv +
         ['server', 'rebuild', '--image', item.snap_name, item.vm_name] }}
  loop: "{{ vm_snapshot_list }}"
  when: operation == 'snapshot' and action_type == 'restore'
  changed_when: true

---
# roles/openstack_vm_manager/tasks/delete.yml

- name: Delete multi vms instances
  openstack.cloud.server:
    auth: "{{ vault_os_auth }}"
    verify: false
    name: "{{ item.name }}"
    state: absent
    wait: true
    timeout: 180
  loop: "{{ openstack_vm_manager_vm_list }}"
  when: operation == 'delete'
  register: openstack_vm_manager_delete_results

- name: Print report after delete
  ansible.builtin.debug:
    msg:
      - "-----------------------------------------"
      - "Virtual_Machine_Name : {{ item.item.name }}"
      - "Result   : {% if item.changed %} has been successfully delted (REMOVED){% else %} nodes not exists or skipped (SKIPPED){% endif %}"
  loop: "{{ openstack_vm_manager_delete_results.results }}"
  when:
    - operation == 'delete'
    - item is defined
  loop_control:
    label: "{{ item.item.name }}"

---
ssl_cert_check_sites:
  - www.google.com
  - github.com

ssl_cert_check_warn_days: 30
ssl_cert_check_critical_days: 10

# Controller/EE path: AAP job log is the durable output for localhost plays.
ssl_cert_check_report_dir: /tmp
ssl_cert_check_report_path: >-
  {{ ssl_cert_check_report_dir }}/ssl_cert_check-{{ inventory_hostname }}.txt

# Display timezone offset in seconds (28800 = Beijing time UTC+8)
ssl_cert_check_timezone_offset_seconds: 28800

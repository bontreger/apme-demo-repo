# ============================================================================
# Role: bind_secondary_dns
# ============================================================================
#
# Description:
#   Deploy and configure a BIND secondary DNS server.
#   - Bulk package install (list)
#   - Copy secondary named.conf
#   - Service enable/start
#   - Optional firewalld rule for DNS service
#   - block/rescue for critical config changes
#
# Author: Ansible Services Platform Team, Red Hat
# Version: 1.0.0
# Date: 2026-06-16
# License: Apache-2.0
#
# ============================================================================
---
- name: Display BIND secondary role configuration for debugging
  ansible.builtin.debug:
    msg:
      - "bind_secondary_dns_bind_secondary_packages: {{ bind_secondary_dns_bind_secondary_packages }}"
      - "bind_secondary_dns_bind_config_dest: {{ bind_secondary_dns_bind_config_dest }}"
      - "bind_secondary_dns_bind_manage_firewall: {{ bind_secondary_dns_bind_manage_firewall }}"
  tags: [debug]

- name: Ensure BIND packages are installed (bulk)
  ansible.builtin.dnf:
    name: "{{ bind_secondary_dns_bind_secondary_packages }}"
    state: present
  tags: [install]

- name: Deploy named.conf for secondary (critical change)
  tags: [config]
  block:
    - name: Ensure secondary named.conf is present
      ansible.builtin.copy:
        src: "{{ bind_secondary_dns_bind_config_src }}"
        dest: "{{ bind_secondary_dns_bind_config_dest }}"
        owner: "{{ bind_secondary_dns_bind_config_owner }}"
        group: "{{ bind_secondary_dns_bind_config_group }}"
        mode: "{{ bind_secondary_dns_bind_config_mode }}"
        setype: "{{ bind_secondary_dns_bind_config_setype }}"
      notify: Restart named

    - name: Show named.conf deployment result for debugging
      ansible.builtin.stat:
        path: "{{ bind_secondary_dns_bind_config_dest }}"
      register: bind_secondary_dns_bind_named_conf_stat
      changed_when: false

    - name: Display named.conf file status for debugging
      ansible.builtin.debug:
        msg:
          - "named.conf exists: {{ bind_secondary_dns_bind_named_conf_stat.stat.exists }}"
          - "named.conf size: {{ bind_secondary_dns_bind_named_conf_stat.stat.size | default('n/a') }}"
  rescue:
    - name: Report named.conf deployment failure
      ansible.builtin.debug:
        msg:
          - "Failed to deploy named.conf for secondary."
          - "Check permissions, SELinux, and file content."
    - name: Fail the play explicitly
      ansible.builtin.fail:
        msg: "Secondary named.conf deployment failed."

- name: Ensure named service is enabled and started
  ansible.builtin.service:
    name: "{{ bind_secondary_dns_bind_service_name }}"
    state: started
    enabled: true
  tags: [service]

- name: Configure firewalld for DNS (optional)
  when: bind_secondary_dns_bind_manage_firewall | bool
  tags: [firewall]
  block:
    - name: Ensure firewalld allows DNS service
      ansible.posix.firewalld:
        service: "{{ bind_secondary_dns_bind_firewalld_service }}"
        state: enabled
        immediate: true
        permanent: true
    - name: Display firewalld configuration for debugging
      ansible.builtin.debug:
        msg:
          - "Firewalld rule applied: service={{ bind_secondary_dns_bind_firewalld_service }}"
  rescue:
    - name: Report firewalld configuration warning
      ansible.builtin.debug:
        msg:
          - "Warning: firewalld configuration failed."
          - "If firewalld is not installed/enabled, set bind_secondary_dns_bind_manage_firewall=false."

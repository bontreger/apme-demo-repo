---
- name: Validate that at least one nameserver is provided
  ansible.builtin.assert:
    that:
      - dns_sync_nameservers | length > 0
    fail_msg: >-
      dns_sync_nameservers must contain at least one IP address.
    quiet: true

- name: Detect active NetworkManager connection
  when: dns_sync_connection | length == 0
  block:
    - name: Retrieve active connections from nmcli
      ansible.builtin.command:
        cmd: nmcli -t -f NAME,DEVICE connection show --active
      changed_when: false
      register: __dns_sync_nmcli_active

    - name: Select first active connection with a device
      ansible.builtin.set_fact:
        dns_sync_connection: >-
          {{ __dns_sync_nmcli_active.stdout_lines
             | reject('match', '^lo:')
             | map('regex_replace', ':.*$', '')
             | first }}

    - name: Fail when no active connection is found
      ansible.builtin.assert:
        that:
          - dns_sync_connection | length > 0
        fail_msg: >-
          No active NetworkManager connection detected. Set
          dns_sync_connection explicitly.
        quiet: true

- name: Display configuration to apply
  ansible.builtin.debug:
    msg:
      - "Connection: {{ dns_sync_connection }}"
      - "Nameservers: {{ dns_sync_nameservers | join(' ') }}"
      - >-
        Search domains:
        {{ dns_sync_search_domains | join(' ') | default('(none)', true) }}

- name: Configure DNS nameservers via NetworkManager
  ansible.builtin.command:
    cmd: >-
      nmcli connection modify '{{ dns_sync_connection }}'
      ipv4.dns '{{ dns_sync_nameservers | join(" ") }}'
      ipv4.ignore-auto-dns yes
  changed_when: true
  notify: Restart NetworkManager connection

- name: Configure DNS search domains via NetworkManager
  ansible.builtin.command:
    cmd: >-
      nmcli connection modify '{{ dns_sync_connection }}'
      ipv4.dns-search '{{ dns_sync_search_domains | join(",") }}'
  changed_when: true
  when: dns_sync_search_domains | length > 0
  notify: Restart NetworkManager connection

- name: Flush handlers to apply DNS changes immediately
  ansible.builtin.meta: flush_handlers
  when: dns_sync_restart_connection | bool

- name: Verify resolv.conf contains the configured nameservers
  ansible.builtin.command:
    cmd: grep -c 'nameserver' /etc/resolv.conf
  changed_when: false
  register: __dns_sync_verify

- name: Report verification result
  ansible.builtin.debug:
    msg: >-
      /etc/resolv.conf contains {{ __dns_sync_verify.stdout | trim }}
      nameserver entries after DNS configuration.

---
- name: Validate check type parameter
  ansible.builtin.assert:
    that:
      - >-
        linux_diagnostic_rca_check_type in
        ['zombie_process', 'disk_io', 'systemd_unit', 'privileged_account']
    fail_msg: >-
      Invalid check_type '{{ linux_diagnostic_rca_check_type }}'.
      Must be one of: zombie_process, disk_io, systemd_unit, privileged_account.
  tags: [always]

- name: Ensure report directory exists
  ansible.builtin.file:
    path: "{{ linux_diagnostic_rca_report_dir }}"
    state: directory
    mode: "0755"

- name: Include check-specific diagnostic tasks
  ansible.builtin.include_tasks:
    file: "checks/{{ linux_diagnostic_rca_check_type }}.yml"

- name: Save investigation report as JSON
  ansible.builtin.copy:
    content: "{{ linux_diagnostic_rca_investigation_report | to_nice_json }}"
    dest: "{{ linux_diagnostic_rca_report_json_path }}"
    mode: "0644"

- name: Write plaintext summary report
  ansible.builtin.copy:
    content: "{{ linux_diagnostic_rca_report_text }}"
    dest: "{{ linux_diagnostic_rca_report_path }}"
    mode: "0644"

- name: Read plaintext report for job output
  ansible.builtin.slurp:
    src: "{{ linux_diagnostic_rca_report_path }}"
  register: __linux_diagnostic_rca_report_slurp

- name: Show diagnostic report in job output
  ansible.builtin.debug:
    msg: "{{ (__linux_diagnostic_rca_report_slurp.content | b64decode).splitlines() }}"

---
- name: Check for non-root users with UID 0
  ansible.builtin.shell: >-
    awk -F: '$3 == 0 && $1 != "root" {print $1}' /etc/passwd
  register: linux_diagnostic_rca_rogue_root_users
  changed_when: false
  failed_when: false

- name: Audit sudoers files for NOPASSWD entries
  ansible.builtin.shell: >-
    set -o pipefail &&
    grep -r "NOPASSWD" /etc/sudoers /etc/sudoers.d/ 2>/dev/null || true
  register: linux_diagnostic_rca_nopasswd_entries
  changed_when: false
  failed_when: false

- name: Identify accounts with empty passwords
  ansible.builtin.shell: >-
    awk -F: '($2 == "") {print $1}' /etc/shadow
  register: linux_diagnostic_rca_empty_passwords
  changed_when: false
  failed_when: false

- name: Set derived security counts
  ansible.builtin.set_fact:
    linux_diagnostic_rca_rogue_count: >-
      {{ linux_diagnostic_rca_rogue_root_users.stdout_lines
         | default([]) | length }}
    linux_diagnostic_rca_nopasswd_count: >-
      {{ linux_diagnostic_rca_nopasswd_entries.stdout_lines
         | default([]) | length }}
    linux_diagnostic_rca_empty_pw_count: >-
      {{ linux_diagnostic_rca_empty_passwords.stdout_lines
         | default([]) | length }}

- name: Fail on critical security issues when requested
  ansible.builtin.assert:
    that:
      - (linux_diagnostic_rca_rogue_count | int) == 0
      - (linux_diagnostic_rca_empty_pw_count | int) == 0
    fail_msg: >-
      CRITICAL: Rogue UID 0 users:
      {{ linux_diagnostic_rca_rogue_count | int }},
      Empty password accounts:
      {{ linux_diagnostic_rca_empty_pw_count | int }}
  when: linux_diagnostic_rca_fail_on_critical | bool

- name: Build investigation report
  ansible.builtin.set_fact:
    linux_diagnostic_rca_investigation_report:
      hostname: "{{ ansible_facts['hostname'] }}"
      os_distribution: "{{ ansible_facts['distribution'] }}"
      os_version: "{{ ansible_facts['distribution_version'] }}"
      audit_timestamp: "{{ ansible_facts['date_time'].iso8601 }}"
      rogue_uid0_users:
        count: "{{ linux_diagnostic_rca_rogue_count | int }}"
        users: >-
          {{ linux_diagnostic_rca_rogue_root_users.stdout_lines
             | default([]) }}
        severity: CRITICAL
      empty_password_accounts:
        count: "{{ linux_diagnostic_rca_empty_pw_count | int }}"
        accounts: >-
          {{ linux_diagnostic_rca_empty_passwords.stdout_lines
             | default([]) }}
        severity: CRITICAL
      sudo_nopasswd_entries:
        count: "{{ linux_diagnostic_rca_nopasswd_count | int }}"
        entries: >-
          {{ linux_diagnostic_rca_nopasswd_entries.stdout_lines
             | default([]) }}
        severity: WARNING
      audit_summary:
        total_critical_issues: >-
          {{ (linux_diagnostic_rca_rogue_count | int)
             + (linux_diagnostic_rca_empty_pw_count | int) }}
        total_warnings: "{{ linux_diagnostic_rca_nopasswd_count | int }}"
        security_status: >-
          {{ 'CRITICAL'
             if ((linux_diagnostic_rca_rogue_count | int) > 0
                 or (linux_diagnostic_rca_empty_pw_count | int) > 0)
             else ('WARNING'
                   if (linux_diagnostic_rca_nopasswd_count | int) > 0
                   else 'HEALTHY') }}

- name: Build plaintext summary
  ansible.builtin.set_fact:
    linux_diagnostic_rca_report_text: |
      Privileged Account Audit - {{ inventory_hostname }}
      Generated: {{ ansible_facts['date_time'].iso8601 }}
      Rogue UID 0 Users: {{ linux_diagnostic_rca_rogue_count | int }}
      Empty Password Accounts: {{ linux_diagnostic_rca_empty_pw_count | int }}
      JSON Report: {{ linux_diagnostic_rca_report_json_path }}

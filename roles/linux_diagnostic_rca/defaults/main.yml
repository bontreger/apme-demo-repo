---
linux_diagnostic_rca_check_type: ""

linux_diagnostic_rca_report_dir: /var/lib/ansible-reports
linux_diagnostic_rca_report_path: >-
  {{ linux_diagnostic_rca_report_dir }}/linux_diagnostic_rca-{{ linux_diagnostic_rca_check_type }}-{{ inventory_hostname }}.txt
linux_diagnostic_rca_report_json_path: >-
  {{ linux_diagnostic_rca_report_dir }}/linux_diagnostic_rca-{{ linux_diagnostic_rca_check_type }}-{{ inventory_hostname }}.json

# systemd_unit check: number of journal lines per failed unit
linux_diagnostic_rca_log_lines: 20

# privileged_account check: abort the play on critical findings
linux_diagnostic_rca_fail_on_critical: false

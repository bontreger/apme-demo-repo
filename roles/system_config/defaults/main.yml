---
# Network configuration
system_config_network:
  allowed_subnets:
    - 10.66.0.0/16
    - 192.168.0.0/16

# Template server configuration
system_config_template_server:
  host: 10.66.208.237
  hosts_file: /etc/hosts

# SELinux configuration
system_config_selinux:
  state: permissive
  policy: targeted

# Backup configuration
system_config_backup:
  enabled: true
  suffix: ".backup.$(date +%Y%m%d_%H%M%S)"

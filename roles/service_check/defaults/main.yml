---
# List of critical services to check
service_check_critical_services_list:
  - sshd
  - firewalld
  - chronyd
  - tuned
  - NetworkManager
  - rsyslog
  - auditd
  - crond
  - dbus
  - systemd-journald

service_check_report_dir: /var/lib/ansible-reports
service_check_report_path: >-
  {{ service_check_report_dir }}/service_check-{{ inventory_hostname }}.txt

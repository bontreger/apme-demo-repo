---
# List of critical services to check
service_check_critical_services_list:
  - sshd
  - firewalld
  - chronyd
  - tuned
  - NetworkManager
  - rsyslog
  - auditd
  - crond
  - dbus
  - systemd-journald

# -----------------------------------------------------------------------------
# Report generation variables (repo-wide standard / Set 1)
# -----------------------------------------------------------------------------
# Intentionally unprefixed so playbooks, hostvars, and report_publish collect
# use the same names documented in docs/reporting-standard.md.
# generate_html and report_publish_enabled: inventory/group_vars/all/reporting.yml
service_check_report_namespace: service_check
service_check_report_local_dir: "/var/lib/ansible-reports/{{ service_check_report_namespace }}"
service_check_report_job_id: "{{ awx_job_id | default(ansible_facts['date_time'].epoch) }}"
service_check_report_text_path: >-
  {{ service_check_report_local_dir }}/{{ inventory_hostname }}-{{ service_check_report_job_id }}.txt

# Deprecated aliases used by validation tasks in this role.
service_check_report_base_path: "{{ service_check_report_local_dir }}"
service_check_collection_dest_path: ""

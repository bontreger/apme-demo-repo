---
# =============================================================================
# report_publish role defaults — PUBLISHING variables only (Set 2)
# =============================================================================
#
# Set 1 (report_namespace, report_local_dir, report_text_path, etc.) is defined
# in playbooks and content-role defaults. See docs/reporting-standard.md.
#
# Required extra var on the job template: report_archive_host
# Optional extra vars: report_publish_web_root, report_publish_url_base
# =============================================================================

# Hosts that generated reports in Play 1 (set by playbooks via localhost fact).
report_publish_source_hosts: "{{ hostvars['localhost'].report_source_hosts | default([]) }}"

report_publish_namespace: "{{ report_namespace | default('') }}"

report_publish_job_id: "{{ report_job_id | default(awx_job_id | default(ansible_date_time.epoch)) }}"

report_publish_archive_host: "{{ report_archive_host }}"

report_publish_web_root: /var/www/ansible-reports

report_publish_url_base: "http://{{ report_archive_host }}/ansible-reports"

report_publish_dest_dir: >-
  {{ report_publish_web_root }}/{{ report_publish_namespace }}/{{ report_publish_job_id }}
report_publish_url: >-
  {{ report_publish_url_base }}/{{ report_publish_namespace }}/{{ report_publish_job_id }}/

report_publish_staging_dir: >-
  /tmp/ansible-report-staging/{{ report_publish_job_id }}

report_publish_retention_days: 30
report_publish_run_cleanup: true

# Set true when the report is written directly on the archive host (aggregated
# reports) and collect from targets is skipped.
report_publish_skip_collect: false

---
- name: Find published report files for index generation
  ansible.builtin.find:
    paths: "{{ report_publish_web_root }}"
    patterns: "*"
    recurse: true
    file_type: file
  register: report_publish_index_files
  run_once: true

- name: Render report archive index page
  ansible.builtin.template:
    src: index.html.j2
    dest: "{{ report_publish_web_root }}/index.html"
    mode: "0644"
  run_once: true

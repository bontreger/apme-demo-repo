---
- name: Validate report publish prerequisites
  ansible.builtin.import_tasks: validate.yml

- name: Collect reports from source hosts
  ansible.builtin.import_tasks: collect.yml
  when:
    - not (report_publish_skip_collect | default(false) | bool)
    - report_publish_source_hosts | length > 0

- name: Generate archive index page
  ansible.builtin.import_tasks: index.yml

- name: Display report publish summary
  ansible.builtin.import_tasks: summary.yml

- name: Clean up old reports on archive host
  ansible.builtin.import_tasks: cleanup.yml
  when: report_publish_run_cleanup | bool

---
- name: Install PostgreSQL packages
  ansible.builtin.dnf:
    name:
      - postgresql-server
      - postgresql
    state: present
  tags: [installation]

- name: Check if PostgreSQL is already initialized
  ansible.builtin.stat:
    path: "{{ postgresql_server_data_dir }}/PG_VERSION"
  register: _pg_version_check
  tags: [configuration]

- name: Ensure PostgreSQL data directory exists
  ansible.builtin.file:
    path: "{{ postgresql_server_data_dir }}"
    state: directory
    owner: postgres
    group: postgres
    mode: "0700"
  when: not _pg_version_check.stat.exists
  tags: [configuration]

- name: Initialize PostgreSQL database (RHEL 7)
  ansible.builtin.command: postgresql-setup initdb
  args:
    creates: "{{ postgresql_server_data_dir }}/PG_VERSION"
  when:
    - not _pg_version_check.stat.exists
    - ansible_distribution_major_version == "7"
  tags: [configuration]

- name: Initialize PostgreSQL database (RHEL 8/9)
  ansible.builtin.command: postgresql-setup --initdb
  args:
    creates: "{{ postgresql_server_data_dir }}/PG_VERSION"
  when:
    - not _pg_version_check.stat.exists
    - ansible_distribution_major_version in ["8", "9"]
  tags: [configuration]

- name: Verify PostgreSQL initialization
  ansible.builtin.stat:
    path: "{{ postgresql_server_data_dir }}/PG_VERSION"
  register: _pg_init_verify
  tags: [configuration]

- name: Fail if PostgreSQL initialization failed
  ansible.builtin.fail:
    msg: "PostgreSQL database initialization failed. Please check logs and try again."
  when: not _pg_init_verify.stat.exists
  tags: [configuration]

- name: Ensure data directory permissions are correct
  ansible.builtin.file:
    path: "{{ postgresql_server_data_dir }}"
    owner: postgres
    group: postgres
    mode: "0700"
    recurse: false
  when: _pg_init_verify.stat.exists
  tags: [configuration]

- name: Configure PostgreSQL Unix socket directory
  ansible.builtin.lineinfile:
    path: "{{ postgresql_server_data_dir }}/postgresql.conf"
    regexp: "^#?unix_socket_directories\\s*="
    line: "unix_socket_directories = '{{ postgresql_server_data_dir }}'"
    backup: true
  when: _pg_init_verify.stat.exists
  tags: [configuration]

- name: Configure PostgreSQL port
  ansible.builtin.lineinfile:
    path: "{{ postgresql_server_data_dir }}/postgresql.conf"
    regexp: "^#?port\\s*="
    line: "port = {{ postgresql_server_port }}"
    backup: true
  when: _pg_init_verify.stat.exists
  tags: [configuration]

- name: Start and enable PostgreSQL service
  ansible.builtin.service:
    name: postgresql
    state: started
    enabled: true
  when: _pg_init_verify.stat.exists
  tags: [configuration]

- name: Check PostgreSQL service status
  ansible.builtin.systemd:
    name: postgresql
  register: _pg_status
  tags: [verification]

- name: Display PostgreSQL status
  ansible.builtin.debug:
    msg:
      - "PostgreSQL deployment completed successfully!"
      - "Service status: {{ _pg_status.status.ActiveState }}"
      - "Data directory: {{ postgresql_server_data_dir }}"
      - "Port: {{ postgresql_server_port }}"
  tags: [verification]

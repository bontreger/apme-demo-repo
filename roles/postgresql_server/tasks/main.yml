---
- name: Validate OS compatibility (RHEL-family 8–10)
  ansible.builtin.assert:
    that:
      - ansible_os_family == "RedHat"
      - ansible_distribution in ["RedHat", "CentOS", "Rocky", "AlmaLinux", "OracleLinux"]
      - ansible_distribution_major_version in ["8", "9", "10"]
    fail_msg: >-
      Unsupported operating system. This role requires RHEL-family 8–10.
      Current OS: {{ ansible_distribution }} {{ ansible_distribution_major_version }}
    success_msg: >-
      OS compatibility check passed:
      {{ ansible_distribution }} {{ ansible_distribution_major_version }}
  tags:
    - always
    - postgresql_server
    - postgresql_server_validation

- name: Install PostgreSQL packages
  ansible.builtin.dnf:
    name:
      - postgresql-server
      - postgresql
    state: present
    update_cache: true
  tags:
    - postgresql_server
    - postgresql_server_install

- name: Check if PostgreSQL is already initialized
  ansible.builtin.stat:
    path: "{{ postgresql_server_data_dir }}/PG_VERSION"
  register: __postgresql_server_version_check
  tags:
    - postgresql_server
    - postgresql_server_configure

- name: Ensure PostgreSQL data directory exists
  ansible.builtin.file:
    path: "{{ postgresql_server_data_dir }}"
    state: directory
    owner: postgres
    group: postgres
    mode: "0700"
  when: not __postgresql_server_version_check.stat.exists
  tags:
    - postgresql_server
    - postgresql_server_configure

- name: Initialize PostgreSQL database
  ansible.builtin.command: postgresql-setup --initdb
  args:
    creates: "{{ postgresql_server_data_dir }}/PG_VERSION"
  when: not __postgresql_server_version_check.stat.exists
  tags:
    - postgresql_server
    - postgresql_server_configure

- name: Verify PostgreSQL initialization
  ansible.builtin.stat:
    path: "{{ postgresql_server_data_dir }}/PG_VERSION"
  register: __postgresql_server_init_verify
  tags:
    - postgresql_server
    - postgresql_server_configure

- name: Fail if PostgreSQL initialization failed
  ansible.builtin.fail:
    msg: >-
      PostgreSQL database initialization failed.
      Please check logs and try again.
  when: not __postgresql_server_init_verify.stat.exists
  tags:
    - postgresql_server
    - postgresql_server_configure

- name: Ensure data directory permissions are correct
  ansible.builtin.file:
    path: "{{ postgresql_server_data_dir }}"
    owner: postgres
    group: postgres
    mode: "0700"
    recurse: false
  when: __postgresql_server_init_verify.stat.exists
  tags:
    - postgresql_server
    - postgresql_server_configure

- name: Ensure PostgreSQL conf.d directory exists
  ansible.builtin.file:
    path: "{{ postgresql_server_data_dir }}/conf.d"
    state: directory
    owner: postgres
    group: postgres
    mode: "0700"
  when: __postgresql_server_init_verify.stat.exists
  tags:
    - postgresql_server
    - postgresql_server_configure

- name: Enable PostgreSQL conf.d include_dir
  ansible.builtin.lineinfile:
    path: "{{ postgresql_server_data_dir }}/postgresql.conf"
    regexp: "^#?include_dir\\s*="
    line: "include_dir = 'conf.d'"
  when: __postgresql_server_init_verify.stat.exists
  notify: Restart postgresql
  tags:
    - postgresql_server
    - postgresql_server_configure

- name: Deploy managed PostgreSQL settings drop-in
  ansible.builtin.template:
    src: 99-ansible-managed.conf.j2
    dest: "{{ postgresql_server_data_dir }}/conf.d/99-ansible-managed.conf"
    owner: postgres
    group: postgres
    mode: "0600"
  when: __postgresql_server_init_verify.stat.exists
  notify: Restart postgresql
  tags:
    - postgresql_server
    - postgresql_server_configure

- name: Start and enable PostgreSQL service
  ansible.builtin.service:
    name: postgresql
    state: started
    enabled: true
  when: __postgresql_server_init_verify.stat.exists
  tags:
    - postgresql_server
    - postgresql_server_configure

- name: Apply pending PostgreSQL restarts before verification
  ansible.builtin.meta: flush_handlers
  tags:
    - postgresql_server
    - postgresql_server_configure

- name: Check PostgreSQL service status
  ansible.builtin.systemd:
    name: postgresql
  register: __postgresql_server_status
  tags:
    - postgresql_server
    - postgresql_server_verify

- name: Display PostgreSQL status
  ansible.builtin.debug:
    msg:
      - "PostgreSQL deployment completed successfully!"
      - "Service status: {{ __postgresql_server_status.status.ActiveState }}"
      - "Data directory: {{ postgresql_server_data_dir }}"
      - "Port: {{ postgresql_server_port }}"
      - >-
        Unix socket directories:
        {{ postgresql_server_unix_socket_directories }}
    verbosity: 1
  tags:
    - postgresql_server
    - postgresql_server_verify

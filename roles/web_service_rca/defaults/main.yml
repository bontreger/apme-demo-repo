---
web_service_rca_service: httpd

web_service_rca_attempt_service_start: false
web_service_rca_collect_journal_lines: 200

web_service_rca_profiles:
  httpd:
    package: httpd
    service: httpd
    config_path: /etc/httpd/conf/httpd.conf
    config_dir: /etc/httpd/conf.d
    syntax_check_cmd: /usr/sbin/httpd -t
    error_log: /var/log/httpd/error_log
    access_log: /var/log/httpd/access_log
    http_ports: [80]
    https_ports: [443]
    selinux_booleans:
      - httpd_can_network_connect
      - httpd_can_network_connect_db
      - httpd_can_sendmail
      - httpd_use_cifs
      - httpd_use_nfs
    firewall_services:
      - http
      - https
  nginx:
    package: nginx
    service: nginx
    config_path: /etc/nginx/nginx.conf
    config_dir: /etc/nginx/conf.d
    work_dir: /var/lib/nginx
    website_dir: /usr/share/nginx/html
    syntax_check_cmd: /usr/sbin/nginx -t
    error_log: /var/log/nginx/error.log
    access_log: /var/log/nginx/access.log
    http_ports: [80]
    https_ports: [443]
    selinux_booleans:
      - httpd_can_network_connect
      - httpd_can_network_connect_db
      - httpd_can_sendmail
      - httpd_use_cifs
      - httpd_use_nfs
    firewall_services:
      - http
      - https

# Reporting
web_service_rca_report_namespace: "{{ web_service_rca_service }}_rca"
web_service_rca_report_local_dir: >-
  /var/lib/ansible-reports/{{ web_service_rca_report_namespace }}
web_service_rca_report_job_id: >-
  {{ awx_job_id | default(ansible_date_time.epoch) }}
web_service_rca_report_text_path: >-
  {{ web_service_rca_report_local_dir }}/{{ inventory_hostname
  }}-{{ web_service_rca_report_job_id }}.txt

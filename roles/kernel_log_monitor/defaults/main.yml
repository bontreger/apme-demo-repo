---
kernel_log_monitor_kernel_errors:
  critical:
    - "Call Trace"
    - "panic"
    - "hung_task_timeout_secs"
  severe:
    - "oom"
    - "segfault"
    - "hardware error"

kernel_log_monitor_alert_message: >-
  System detected kernel-level anomalies, please check immediately!
  Host: {{ inventory_hostname }}
kernel_log_monitor_log_lines: 100
kernel_log_monitor_kernel_events_log: "/var/log/kernel_events.log"

# -----------------------------------------------------------------------------
# Report generation variables (repo-wide standard / Set 1)
# -----------------------------------------------------------------------------
# Intentionally unprefixed — see docs/reporting-standard.md.
# generate_html and report_publish_enabled: inventory/group_vars/all/reporting.yml
report_namespace: kernel_log_monitor  # noqa: var-naming[no-role-prefix]
report_local_dir: "/var/lib/ansible-reports/{{ report_namespace }}"  # noqa: var-naming[no-role-prefix]
report_job_id: "{{ awx_job_id | default(ansible_facts['date_time'].epoch) }}"  # noqa: var-naming[no-role-prefix]
report_text_path: >-  # noqa: var-naming[no-role-prefix]
  {{ report_local_dir }}/{{ inventory_hostname }}-{{ report_job_id }}.txt
report_html_path: >-  # noqa: var-naming[no-role-prefix]
  {{ report_local_dir }}/{{ inventory_hostname }}-{{ report_job_id }}.html

# Deprecated aliases used by validation tasks in this role.
kernel_log_monitor_report_base_path: "{{ report_local_dir }}"
kernel_log_monitor_collection_dest_path: ""

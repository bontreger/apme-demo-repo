---
- name: Collect top output (batch mode)
  ansible.builtin.command: top -b -n 1
  register: _memory_rca_top
  changed_when: false
  failed_when: false

- name: Collect per-process memory usage (ps aux)
  ansible.builtin.command: ps aux
  register: _memory_rca_ps
  changed_when: false
  failed_when: false

- name: Collect hierarchical process memory (ps auxH)
  ansible.builtin.command: ps auxH
  register: _memory_rca_ps_h
  changed_when: false
  failed_when: false

- name: Collect system performance statistics (sar -A)
  ansible.builtin.command: sar -A 1 1
  register: _memory_rca_sar
  changed_when: false
  failed_when: false

- name: Collect disk I/O statistics (iostat -x)
  ansible.builtin.command: iostat -x
  register: _memory_rca_iostat
  changed_when: false
  failed_when: false

- name: Collect open files (lsof)
  ansible.builtin.command: lsof
  register: _memory_rca_lsof
  changed_when: false
  failed_when: false

- name: Collect filesystem usage (df -hT)
  ansible.builtin.command: df -hT
  register: _memory_rca_df
  changed_when: false
  failed_when: false

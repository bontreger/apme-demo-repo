---
# high_utilization or oom
memory_rca_mode: high_utilization

memory_rca_collect_journal_lines: 200

# Reporting
memory_rca_report_namespace: "memory_{{ memory_rca_mode }}"
memory_rca_report_local_dir: "/var/lib/ansible-reports/{{ memory_rca_report_namespace }}"
memory_rca_report_job_id: "{{ awx_job_id | default(ansible_date_time.epoch) }}"
memory_rca_report_text_path: >-
  {{ memory_rca_report_local_dir }}/{{ inventory_hostname }}-{{ memory_rca_report_job_id }}.txt

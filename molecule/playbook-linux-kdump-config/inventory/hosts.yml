---
# rhel9 mapped into all_rhel (the playbook target). Default dump target is
# "Local" (writes /etc/kdump.conf + /var/crash), so the playbook runs without a
# survey.
#
# NOTE: the role applies kernel panic triggers live via sysctl
# (vm.panic_on_oom, kernel.softlockup_panic, kernel.hung_task_panic,
# kernel.unknown_nmi_panic = 1). After converge the instance will PANIC if any
# of those conditions occur. verify is light, so the risk is low, and the
# instance is destroyed afterwards -- but that is why this scenario is not
# run automatically.
all:
  children:
    molecule:
      hosts:
        rhel9:
          molecule_aws_ami_name: RHEL-9*HVM*x86_64*
    all_rhel:
      hosts:
        rhel9:

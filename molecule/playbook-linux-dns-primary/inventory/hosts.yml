---
# rhel9 only: playbook pre_task rejects RHEL 10. Group membership is additive.
all:
  children:
    molecule:
      hosts:
        rhel9:
          molecule_aws_ami_name: RHEL-9*HVM*x86_64*
    primary_dns:
      hosts:
        rhel9:
      vars:
        # import_playbook sets playbook_dir to playbooks/ — use molecule env instead.
        bind_primary_dns_bind_config_src: "{{ lookup('env', 'MOLECULE_SCENARIO_DIRECTORY') }}/files/named-primary.conf"
        bind_primary_dns_bind_zone_src_dir: "{{ lookup('env', 'MOLECULE_SCENARIO_DIRECTORY') }}/files/zones"
        bind_primary_dns_bind_manage_firewall: false

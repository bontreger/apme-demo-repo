// Ansible-managed BIND Primary Server Configuration (molecule test)
// Matches the default molecule throwaway VPC (10.77.0.0/24).
options {
    listen-on port 53 { 127.0.0.1; 10.77.0.0/24; };
    listen-on-v6 port 53 { ::1; };
    directory       "/var/named";
    dump-file       "/var/named/data/cache_dump.db";
    statistics-file "/var/named/data/named_stats.txt";
    memstatistics-file "/var/named/data/named_mem_stats.txt";
    recursing-file  "/var/named/data/named.recursing";
    secroots-file   "/var/named/data/named.secroots";

    allow-query     { localhost; 10.77.0.0/24; };
    allow-transfer  { localhost; 10.77.0.11; 10.77.0.12; };

    recursion no;

    dnssec-enable yes;
    dnssec-validation yes;

    bindkeys-file "/etc/named.root.key";

    managed-keys-directory "/var/named/dynamic";

    pid-file "/run/named/named.pid";
    session-keyfile "/run/named/session.key";
};

logging {
        channel default_debug {
                file "data/named.run";
                severity dynamic;
        };
};

zone "." IN {
    type hint;
    file "named.ca";
};

include "/etc/named.rfc1912.zones";
include "/etc/named.root.key";

zone "pvt.example.com" IN {
    type master;
    file "pvt.example.com.zone";
    allow-update { none; };
};

zone "0.77.10.in-addr.arpa" IN {
    type master;
    file "0.77.10.in-addr.arpa.zone";
    allow-update { none; };
};

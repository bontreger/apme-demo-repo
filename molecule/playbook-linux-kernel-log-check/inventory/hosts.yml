---
# rhel9 mapped into all_rhel (the playbook target). Pin the report job id so
# converge and verify resolve the same report path — the role's default is
# ansible_date_time.epoch, which changes between plays.
all:
  children:
    molecule:
      hosts:
        rhel9:
          molecule_aws_ami_name: RHEL-9*HVM*x86_64*
    all_rhel:
      hosts:
        rhel9:
      vars:
        report_job_id: molecule

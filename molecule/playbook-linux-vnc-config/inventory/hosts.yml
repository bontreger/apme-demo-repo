---
# rhel9 is the only shared OS the playbook admits (its pre_task asserts
# ansible_distribution_major_version in 7/8/9). Declared here rather than
# pulled from the shared linux layer so rhel10 is never provisioned. Group
# membership is additive: rhel9 lands in `molecule` (the lifecycle playbooks
# provision it) and in `all_rhel` (the playbook under test targets it).
all:
  children:
    molecule:
      hosts:
        rhel9:
          molecule_aws_ami_name: RHEL-9*HVM*x86_64*
    all_rhel:
      hosts:
        rhel9:
      vars:
        # Trimmed test (see README): install only the VNC server, not the role
        # default's @workstation (full GNOME, ~1GB). This exercises the role's
        # user/config/password logic without the heavy desktop install, and
        # overrides the role default which is lower precedence than inventory.
        vnc_config_packages:
          - tigervnc-server
        # The role default is an empty password, which fails its own >=6-char
        # validation (masked by failed_when: false). Supply a valid test
        # password so vncpasswd produces a real passwd file. Test-only value.
        vnc_config_password: "vncpass1"

---
# Map the shared Windows instance into the group the playbook targets and give
# the role a package to install — its default package list is empty, which
# would make the converge a no-op.
#
# EXTERNAL DEPENDENCY: win_package needs a real installer plus the exact
# product_id it registers, so this pins the 7-Zip MSI from the role's own
# documented example. Both values move together — a new MSI version means a
# new URL AND a new product_id, and this scenario fails until both are
# updated. Mirror the MSI somewhere you control if the test needs to be
# durable.
all:
  children:
    all_windows:
      hosts:
        win2022:
          win_software_management_state: present
          win_software_management_packages:
            - name: 7-Zip
              path: https://www.7-zip.org/a/7z2301-x64.msi
              product_id: "{23170F69-40C1-2702-2301-000001000000}"

---
- name: Verify
  hosts: all_rhel
  become: true
  gather_facts: false
  tasks:
    - name: Read /etc/resolv.conf
      ansible.builtin.slurp:
        src: /etc/resolv.conf
      register: resolv_content

    - name: Assert configured nameserver is present
      ansible.builtin.assert:
        that:
          - >-
            (resolv_content.content | b64decode)
            is search('nameserver 10.77.0.2')
        fail_msg: >-
          Expected nameserver 10.77.0.2 in /etc/resolv.conf; got:
          {{ resolv_content.content | b64decode | truncate(200) }}

    - name: Assert search domain is present
      ansible.builtin.assert:
        that:
          - >-
            (resolv_content.content | b64decode)
            is search('search.*molecule\.test')
        fail_msg: >-
          Expected search domain molecule.test in /etc/resolv.conf; got:
          {{ resolv_content.content | b64decode | truncate(200) }}

---
# rhel9 only: playbook pre_task rejects RHEL 10. Group membership is additive.
all:
  children:
    molecule:
      hosts:
        rhel9:
          molecule_aws_ami_name: RHEL-9*HVM*x86_64*
    all_rhel:
      hosts:
        rhel9:
      vars:
        # Source is read on the molecule controller (delegate_to: localhost).
        dns_sync_source_file_path: "{{ lookup('env', 'MOLECULE_SCENARIO_DIRECTORY') }}/files/resolv.conf"
        # Do not overwrite live /etc/resolv.conf on the test VM.
        dns_sync_dest_file_path: /tmp/molecule-dns-sync-resolv.conf
        dns_sync_backup_enabled: true

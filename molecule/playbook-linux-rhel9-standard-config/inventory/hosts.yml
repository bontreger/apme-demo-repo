---
# The play's `hosts: rhel9` pattern matches this host by name, so no group of
# that name is declared — one would collide with the host and warn.
#
# template_servers points at the host itself: hosts_config fetches /etc/hosts
# from `groups['template_servers'][0]`, falling back to an unroutable address.
all:
  children:
    molecule:
      hosts:
        rhel9:
          molecule_aws_ami_name: RHEL-9*HVM*x86_64*
    template_servers:
      hosts:
        rhel9:

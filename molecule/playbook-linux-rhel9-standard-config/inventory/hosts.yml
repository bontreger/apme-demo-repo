---
# The play's `hosts: rhel9` pattern matches the target by name, so no group of
# that name is declared — one would collide with the host and warn.
#
# hosts-template is a second instance acting as the template server that
# hosts_config fetches /etc/hosts from. It is deliberately outside the `rhel9`
# pattern so the playbook never configures it and its /etc/hosts stays fixed,
# which is the topology the role is written for.
all:
  children:
    molecule:
      hosts:
        rhel9:
          molecule_aws_ami_name: RHEL-9*HVM*x86_64*
        hosts-template:
          molecule_aws_ami_name: RHEL-9*HVM*x86_64*
    template_servers:
      hosts:
        hosts-template:

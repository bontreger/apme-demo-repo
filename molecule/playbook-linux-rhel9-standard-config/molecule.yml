---
# The playbook targets `hosts: rhel9` and asserts RHEL 9 in a pre_task, so the
# shared linux layer (which also ships rhel10) is dropped and the host is
# declared locally. base/ stays for localhost + platform group_vars.
scenario:
  test_sequence:
    - dependency
    - syntax
    - create
    - prepare
    - converge
    - idempotence
    - verify
    - destroy

ansible:
  executor:
    args:
      ansible_playbook:
        - --inventory=../utils/inventory/base/
        - --inventory=inventory/

---
- name: Verify
  hosts: rhel9
  become: true
  gather_facts: true
  vars:
    expected_admin_user: admin
    expected_selinux_state: permissive
    expected_firewall_ports: [50051, 53, 80, 443, 5432, 6379, 27199, 9000, 9001, 9002, 9003]
    expected_ntp_servers: [ntp.aliyun.com, ntp1.aliyun.com, ntp2.aliyun.com]
    expected_limits:
      - "* soft nofile 65536"
      - "* hard nofile 65536"
    expected_sysctl:
      net.core.somaxconn: "65535"
      net.ipv4.tcp_max_syn_backlog: "65535"
      vm.max_map_count: "262144"
  tasks:
    - name: Look up the admin user
      ansible.builtin.getent:
        database: passwd
        key: "{{ expected_admin_user }}"

    - name: Assert the admin user exists with a bash login shell
      ansible.builtin.assert:
        that:
          - ansible_facts.getent_passwd[expected_admin_user][-1] == '/bin/bash'
        fail_msg: >-
          {{ expected_admin_user }} shell is
          {{ ansible_facts.getent_passwd[expected_admin_user][-1] }}

    - name: Read the sudoers drop-in
      ansible.builtin.slurp:
        src: /etc/sudoers.d/{{ expected_admin_user }}
      register: verify_sudoers

    - name: Assert passwordless sudo is configured for the admin user
      ansible.builtin.assert:
        that:
          - "expected_admin_user + ' ALL=(ALL) NOPASSWD: ALL' in (verify_sudoers.content | b64decode)"

    - name: Read the persistent SELinux config
      ansible.builtin.slurp:
        src: /etc/selinux/config
      register: verify_selinux_config

    - name: Assert SELinux is set to the configured state persistently
      ansible.builtin.assert:
        that:
          - "'SELINUX=' + expected_selinux_state in (verify_selinux_config.content | b64decode)"

    - name: Query the runtime SELinux mode
      ansible.builtin.command: getenforce
      register: verify_getenforce
      changed_when: false

    - name: Assert the runtime mode is no longer enforcing
      ansible.builtin.assert:
        that:
          - verify_getenforce.stdout in ['Permissive', 'Disabled']

    - name: Query the firewalld state
      ansible.builtin.command: firewall-cmd --state
      register: verify_firewalld
      changed_when: false
      failed_when: false

    - name: Assert firewalld is running
      ansible.builtin.assert:
        that:
          - verify_firewalld.rc == 0
        fail_msg: >-
          firewalld is not running, so firewall_config skipped every port it
          was asked to open (the role warns and continues instead of failing).

    - name: List the open firewall ports
      ansible.builtin.command: firewall-cmd --list-ports
      register: verify_ports
      changed_when: false

    - name: Assert every configured port is open
      ansible.builtin.assert:
        that:
          - (item | string) + '/tcp' in verify_ports.stdout
        fail_msg: "{{ item }}/tcp missing from: {{ verify_ports.stdout }}"
      loop: "{{ expected_firewall_ports }}"

    - name: Read the hosts file
      ansible.builtin.slurp:
        src: /etc/hosts
      register: verify_hosts

    - name: Assert the host's own address and name are present
      ansible.builtin.assert:
        that:
          - ansible_default_ipv4.address in hosts_text
          - ansible_hostname in hosts_text
      vars:
        hosts_text: "{{ verify_hosts.content | b64decode }}"

    - name: Assert the template server's content was merged in
      ansible.builtin.assert:
        that:
          - "'template-marker.example.com' in hosts_text"
        fail_msg: >-
          The marker prepare.yml wrote to the template server is missing, so
          the fetch/copy/merge chain did not deliver the template.
      vars:
        hosts_text: "{{ verify_hosts.content | b64decode }}"

    - name: Read the chrony configuration
      ansible.builtin.slurp:
        src: /etc/chrony.conf
      register: verify_chrony

    - name: Assert every configured NTP server is present
      ansible.builtin.assert:
        that:
          - item in (verify_chrony.content | b64decode)
      loop: "{{ expected_ntp_servers }}"

    - name: Collect service facts
      ansible.builtin.service_facts:

    - name: Assert chronyd is running and enabled
      ansible.builtin.assert:
        that:
          - ansible_facts.services['chronyd.service'].state == 'running'
          - ansible_facts.services['chronyd.service'].status == 'enabled'

    - name: Read the system limits configuration
      ansible.builtin.slurp:
        src: /etc/security/limits.conf
      register: verify_limits

    - name: Assert the configured limits are present
      ansible.builtin.assert:
        that:
          - item in (verify_limits.content | b64decode)
      loop: "{{ expected_limits }}"

    - name: Stat the sysctl drop-in the role writes
      ansible.builtin.stat:
        path: /etc/sysctl.d/99-ansible.conf
      register: verify_sysctl_file

    - name: Assert the sysctl drop-in exists
      ansible.builtin.assert:
        that:
          - verify_sysctl_file.stat.exists

    - name: Query the runtime sysctl values
      ansible.builtin.command: sysctl -n {{ item.key }}
      register: verify_sysctl
      changed_when: false
      loop: "{{ expected_sysctl | dict2items }}"
      loop_control:
        label: "{{ item.key }}"

    - name: Assert the runtime sysctl values were applied
      ansible.builtin.assert:
        that:
          - item.stdout == item.item.value
        fail_msg: "{{ item.item.key }} is {{ item.stdout }}, expected {{ item.item.value }}"
      loop: "{{ verify_sysctl.results }}"
      loop_control:
        label: "{{ item.item.key }}"

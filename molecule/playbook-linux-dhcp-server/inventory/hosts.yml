---
# rhel9 only: playbook pre_task rejects RHEL 10. Group membership is
# additive — rhel9 is in `molecule` (provisioned) and `dhcp_servers` (converge).
all:
  children:
    molecule:
      hosts:
        rhel9:
          molecule_aws_ami_name: RHEL-9*HVM*x86_64*
    dhcp_servers:
      hosts:
        rhel9:
      vars:
        # import_playbook sets playbook_dir to playbooks/ — use molecule env instead.
        dhcp_server_dhcp_config_file: "{{ lookup('env', 'MOLECULE_SCENARIO_DIRECTORY') }}/files/dhcpd.conf"
        dhcp_server_dhcp6_config_file: "{{ lookup('env', 'MOLECULE_SCENARIO_DIRECTORY') }}/files/dhcpd6.conf"
        dhcp_server_dhcp_manage_firewall: false

# Ansible-managed DHCPv4 Configuration (molecule test)
# Matches the default molecule throwaway VPC (10.77.0.0/24).
authoritative;

subnet 10.77.0.0 netmask 255.255.255.0 {
  range 10.77.0.150 10.77.0.254;
  option routers 10.77.0.1;
  option domain-name-servers 8.8.8.8;
  default-lease-time 600;
  max-lease-time 7200;
}

---
- name: Verify
  hosts: all_rhel
  become: true
  gather_facts: false
  vars:
    filesystem_check_report_path: >-
      /var/lib/ansible-reports/filesystem_check-{{ inventory_hostname }}.txt
  tasks:
    - name: Stat the plaintext report
      ansible.builtin.stat:
        path: "{{ filesystem_check_report_path }}"
      register: filesystem_check_report

    - name: Assert plaintext report was written
      ansible.builtin.assert:
        that:
          - filesystem_check_report.stat.exists
          - filesystem_check_report.stat.isreg
          - filesystem_check_report.stat.size | int > 0

    - name: Read plaintext report
      ansible.builtin.slurp:
        src: "{{ filesystem_check_report_path }}"
      register: filesystem_check_report_content

    - name: Assert report contains expected diagnostic sections
      ansible.builtin.assert:
        that:
          - "'Filesystem Health Check Report - ' ~ inventory_hostname in report_text"
          - "'Disk Usage (df -h)' in report_text"
          - "'Inode Usage (df -i)' in report_text"
          - "'Filesystem Check Results' in report_text"
      vars:
        report_text: "{{ filesystem_check_report_content.content | b64decode }}"

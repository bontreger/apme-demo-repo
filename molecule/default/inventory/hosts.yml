---
# Scenario-local inventory, layered on top of the shared molecule/utils/inventory/
# (later sources win). Hosts are matched by name, so entries here only add
# vars to the shared hosts — the molecule_expected_* values are used by this
# scenario's verify.yml and are not part of the shared inventory.
all:
  children:
    molecule:
      hosts:
        rhel10:
          molecule_expected_os_family: RedHat
          molecule_expected_major: "10"
        rhel9:
          molecule_expected_os_family: RedHat
          molecule_expected_major: "9"
        win2022:
          molecule_expected_os_family: Windows

---
# Scenario-local inventory, layered on top of the shared molecule/inventory/
# (later sources win). Hosts are matched by name, so entries here only add or
# override vars for the shared hosts — molecule_expected_rhel_major is used by
# this scenario's verify.yml and is not part of the shared inventory.
all:
  children:
    molecule:
      hosts:
        rhel10:
          molecule_expected_rhel_major: "10"
        rhel9:
          molecule_expected_rhel_major: "9"

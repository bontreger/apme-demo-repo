---
# Single rhel9 host. The converge applies the role directly (not the playbook
# import) so it can override the role's dangerous vars/main.yml example
# operations via role params — see README. It operates only on an isolated
# dummy interface, so nothing touches the primary NIC or routing.
all:
  children:
    molecule:
      hosts:
        rhel9:
          molecule_aws_ami_name: RHEL-9*HVM*x86_64*

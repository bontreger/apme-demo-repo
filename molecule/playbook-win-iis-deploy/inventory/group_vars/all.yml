---
# The role finishes with a win_uri self-check against ansible_host — the
# instance's PUBLIC IP — so that request leaves the VPC and comes back in
# through the internet gateway, where the test security group applies. Open
# HTTP for it, and HTTPS because the role adds an inbound rule for 443 too.
#
# If the converge still fails on that self-check with a connection timeout
# rather than a refusal, the cause is the guest not being able to hairpin to
# its own public address; the durable fix is in the role (check
# http://localhost/), not here.
molecule_aws_extra_ports:
  - 80
  - 443

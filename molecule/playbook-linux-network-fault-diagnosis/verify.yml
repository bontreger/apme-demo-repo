---
- name: Verify
  hosts: all_rhel
  become: true
  gather_facts: false
  vars:
    network_diagnosis_report_path: >-
      /var/lib/ansible-reports/report_generation-{{ inventory_hostname }}.txt
  tasks:
    - name: Stat the diagnosis report
      ansible.builtin.stat:
        path: "{{ network_diagnosis_report_path }}"
      register: network_diagnosis_report

    - name: Assert diagnosis report was written
      ansible.builtin.assert:
        that:
          - network_diagnosis_report.stat.exists
          - network_diagnosis_report.stat.isreg
          - network_diagnosis_report.stat.size | int > 0

    - name: Read diagnosis report
      ansible.builtin.slurp:
        src: "{{ network_diagnosis_report_path }}"
      register: network_diagnosis_report_content

    - name: Assert report contains expected diagnostic sections
      ansible.builtin.assert:
        that:
          - "'RHEL Network Latency Diagnosis Report' in report_text"
          - "'1. Network Interface Status Check' in report_text"
          - "'3. System Diagnosis Results' in report_text"
          - "'Report Generation Completed' in report_text"
          - "'Network Interface: eth0' in report_text"
      vars:
        report_text: "{{ network_diagnosis_report_content.content | b64decode }}"

---
# rhel9 is the only OS the playbook admits (pre_task asserts RedHat/CentOS
# 7/8/9). Declared here rather than pulled from the shared linux layer so
# rhel10 is never provisioned.
#
# The playbook's pre_task assert requires network_interface and
# report_output_dir before roles run — set them explicitly for molecule. AWS
# EC2 guests use eth0 (role default ens192 is wrong on this AMI). Disable
# traffic capture to avoid a ~30s tcpdump wait; Molecule verifies the report,
# not packet capture.
all:
  children:
    molecule:
      hosts:
        rhel9:
          molecule_aws_ami_name: RHEL-9*HVM*x86_64*
    all_rhel:
      hosts:
        rhel9:
      vars:
        network_interface: eth0
        report_namespace: network_diagnosis
        report_local_dir: /var/lib/ansible-reports/network_diagnosis
        report_output_dir: /var/lib/ansible-reports/network_diagnosis
        report_job_id: molecule
        traffic_capture:
          enabled: false

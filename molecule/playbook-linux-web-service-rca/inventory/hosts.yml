---
# Map the shared instances into the group the playbook targets.
# Pin report_job_id so converge and verify resolve the same report path
# (defaults otherwise use ansible_date_time.epoch, which changes between plays).
all:
  children:
    all_rhel:
      hosts:
        rhel9:
        rhel10:
      vars:
        web_service_rca_report_job_id: molecule

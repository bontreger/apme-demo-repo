---
# rhel9 mapped into all_rhel (the playbook target). All MariaDB parameters have
# role defaults (root/user passwords, db name), so the playbook runs without a
# survey. The default passwords are test-only placeholders shipped by the role.
all:
  children:
    molecule:
      hosts:
        rhel9:
          molecule_aws_ami_name: RHEL-9*HVM*x86_64*
    all_rhel:
      hosts:
        rhel9:

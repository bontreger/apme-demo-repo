---
# Shared default inventory used by every scenario (see
# .config/molecule/config.yml). A scenario can add hosts or override vars with
# its own inventory/ directory, layered on top of this one.
#
# Hosts in the `molecule` group are the test instances the utils playbooks
# create. Each host defines its own image identity here:
#   molecule_aws_ami_name             — AWS AMI lookup filter (newest match wins)
#   molecule_kubevirt_data_source_name — KubeVirt DataSource for the root disk
# Optional per-host: molecule_aws_ami_owner (defaults to Red Hat, see
# group_vars/all.yml) and molecule_aws_image_id (pin an AMI, skips the lookup).
#
# localhost is listed explicitly so it joins `all` and picks up the
# molecule_aws_* / molecule_kubevirt_* vars from group_vars/all.yml (implicit
# localhost would not).
all:
  hosts:
    localhost:
      ansible_connection: local
      ansible_python_interpreter: "{{ ansible_playbook_python }}"
  children:
    molecule:
      hosts:
        rhel10:
          molecule_aws_ami_name: RHEL-10*HVM*x86_64*
          molecule_kubevirt_data_source_name: rhel10
        rhel9:
          molecule_aws_ami_name: RHEL-9*HVM*x86_64*
          molecule_kubevirt_data_source_name: rhel9

---
# Playbook targets all_rhel and asserts RHEL/CentOS 7/8/9 only — not RHEL 10.
all:
  children:
    all_rhel:
      hosts:
        rhel9:
      vars:
        nfs_server_shared_directory: /srv/myshare
        nfs_server_exports_filename: ansible-share.exports
        nfs_server_export_entries:
          - "10.77.0.0/24(rw,sync,no_subtree_check,no_root_squash)"

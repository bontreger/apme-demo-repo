---
# rhel9 is the only shared OS the playbook admits (its pre_task asserts
# ansible_distribution_major_version in 7/8/9). Declared here rather than
# pulled from the shared linux layer so rhel10 is never provisioned. Group
# membership is additive: rhel9 lands in `molecule` (the lifecycle playbooks
# provision it) and in `all_rhel` (the playbook under test targets it).
#
# Safe to run: the role defaults set runtime -> permissive (no reboot, keeps
# SSH working) and only write SELINUX=disabled to /etc/selinux/config for the
# next boot, which molecule never performs before destroying the instance.
all:
  children:
    molecule:
      hosts:
        rhel9:
          molecule_aws_ami_name: RHEL-9*HVM*x86_64*
    all_rhel:
      hosts:
        rhel9:

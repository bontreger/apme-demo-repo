---
# rhel9 is the only OS the playbook admits (pre_task asserts 7/8/9). Declared
# here rather than pulled from the shared linux layer so rhel10 is never
# provisioned. Group membership is additive: rhel9 lands in `molecule`
# (provisioned), `all_rhel` (playbook target), and `ftp_servers` (enables
# server-side checks in the role on the same host).
#
# Pin the report job id so converge and verify resolve the same report path —
# the role's default is ansible_date_time.epoch, which changes between plays.
all:
  children:
    molecule:
      hosts:
        rhel9:
          molecule_aws_ami_name: RHEL-9*HVM*x86_64*
    all_rhel:
      hosts:
        rhel9:
    ftp_servers:
      hosts:
        rhel9:
      vars:
        ftp_rca_report_job_id: molecule

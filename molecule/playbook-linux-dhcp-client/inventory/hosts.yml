---
# rhel9 only: playbook pre_task rejects RHEL 10. Group membership is
# additive — rhel9 is in `molecule` (provisioned) and `dhcp_clients` (converge).
all:
  children:
    molecule:
      hosts:
        rhel9:
          molecule_aws_ami_name: RHEL-9*HVM*x86_64*
    dhcp_clients:
      hosts:
        rhel9:

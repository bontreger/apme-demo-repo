---
# rhel9 only: playbook pre_task rejects RHEL 10. Group membership is additive.
all:
  children:
    molecule:
      hosts:
        rhel9:
          molecule_aws_ami_name: RHEL-9*HVM*x86_64*
    caching_dns:
      hosts:
        rhel9:
      vars:
        unbound_caching_dns_unbound_allowed_networks:
          - "10.77.0.0/24"
          - "127.0.0.0/8"
        unbound_caching_dns_unbound_forwarder_ip: "8.8.8.8"
        unbound_caching_dns_unbound_manage_firewall: false

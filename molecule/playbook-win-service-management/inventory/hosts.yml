---
# Map the shared Windows instance into the group the playbook targets, and
# give the role something to act on: its defaults are action=check over an
# EMPTY service list, which would make the converge a no-op.
#
# W32Time and Spooler both ship with Windows Server, so the scenario exercises
# the real code path without installing anything. W32Time is trigger-started
# out of the box, which makes the start_mode change a genuine assertion rather
# than a restatement of the AMI's defaults.
all:
  children:
    all_windows:
      hosts:
        win2022:
          win_service_management_action: start
          win_service_management_start_mode: auto
          win_service_management_services:
            - W32Time
            - Spooler

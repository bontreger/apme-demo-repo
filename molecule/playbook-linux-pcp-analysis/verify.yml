---
- name: Verify PCP analysis results on target hosts
  hosts: pcp_servers
  become: true
  gather_facts: false
  vars:
    pcp_report_path: /var/lib/ansible-reports/pcp_analysis-{{ inventory_hostname }}.txt
    pcp_report_host_heading: "## Host: {{ inventory_hostname }}"
  tasks:
    - name: Stat the PCP report
      ansible.builtin.stat:
        path: "{{ pcp_report_path }}"
      register: pcp_report

    - name: Assert PCP report was written
      ansible.builtin.assert:
        that:
          - pcp_report.stat.exists
          - pcp_report.stat.isreg
          - pcp_report.stat.size | int > 0

    - name: Read the PCP report
      ansible.builtin.slurp:
        src: "{{ pcp_report_path }}"
      register: pcp_report_content

    - name: Assert report contains expected content
      ansible.builtin.assert:
        that:
          - "'RHEL Performance Analysis Report' in report_text"
          - pcp_report_host_heading in report_text
          - "'System Overview (PCP)' in report_text"
      vars:
        report_text: "{{ pcp_report_content.content | b64decode }}"

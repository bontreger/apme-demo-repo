---
# The playbook's OS gate accepts RHEL 7/8/9 only, so provision just rhel9:
# drop the shared linux layer (which also ships rhel10) and declare the host
# locally in inventory/. Keep base/ for localhost + platform group_vars.
ansible:
  executor:
    args:
      ansible_playbook:
        - --inventory=../utils/inventory/base/
        - --inventory=inventory/
        - -e
        - report_archive_host=rhel9
        - -e
        - report_job_id=molecule

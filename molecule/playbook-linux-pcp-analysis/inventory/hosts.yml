---
# rhel9 is provisioned for install (all_rhel) and collection (pcp_servers).
# Play 3 (report) delegates to report_archive_host — use localhost (the
# molecule controller) so publish is not required.
all:
  children:
    molecule:
      hosts:
        rhel9:
          molecule_aws_ami_name: RHEL-9*HVM*x86_64*
    all_rhel:
      hosts:
        rhel9:
    pcp_servers:
      hosts:
        rhel9:

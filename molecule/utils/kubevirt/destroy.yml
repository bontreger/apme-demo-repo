---
# Delete the VirtualMachines and Services create.yml made. DataVolumes are
# owned by the VM and garbage-collected with it. The namespace is left in
# place — it may be shared with other scenarios.
- name: Destroy KubeVirt instances
  hosts: localhost
  gather_facts: false
  tasks:
    - name: Delete VirtualMachine
      kubernetes.core.k8s:
        state: absent
        api_version: kubevirt.io/v1
        kind: VirtualMachine
        name: "{{ item }}"
        namespace: "{{ molecule_kubevirt_namespace }}"
      loop: "{{ groups['molecule'] }}"

    - name: Delete NodePort SSH service
      kubernetes.core.k8s:
        state: absent
        api_version: v1
        kind: Service
        name: "{{ item }}"
        namespace: "{{ molecule_kubevirt_namespace }}"
      loop: "{{ groups['molecule'] }}"

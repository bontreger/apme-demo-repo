---
# rhel9 only: playbook pre_task rejects RHEL 10. Group membership is additive.
all:
  children:
    molecule:
      hosts:
        rhel9:
          molecule_aws_ami_name: RHEL-9*HVM*x86_64*
    secondary_dns:
      hosts:
        rhel9:
      vars:
        bind_secondary_dns_bind_config_src: "{{ lookup('env', 'MOLECULE_SCENARIO_DIRECTORY') }}/files/named-secondary.conf"
        bind_secondary_dns_bind_manage_firewall: false

---
- name: Verify
  hosts: secondary_dns
  become: true
  gather_facts: false
  tasks:
    - name: Collect installed package facts
      ansible.builtin.package_facts:
        manager: auto

    - name: Assert bind package is installed
      ansible.builtin.assert:
        that:
          - "'bind' in ansible_facts.packages"

    - name: Stat named.conf
      ansible.builtin.stat:
        path: /etc/named.conf
      register: named_conf

    - name: Assert named.conf is deployed
      ansible.builtin.assert:
        that:
          - named_conf.stat.exists
          - named_conf.stat.isreg

    - name: Read named.conf marker
      ansible.builtin.slurp:
        src: /etc/named.conf
      register: named_conf_content

    - name: Assert named.conf is molecule-managed sample
      ansible.builtin.assert:
        that:
          - (named_conf_content.content | b64decode) is search('Ansible-managed BIND Secondary')
          - (named_conf_content.content | b64decode) is search('10.77.0.10')
        fail_msg: >-
          Expected molecule named-secondary.conf content; got:
          {{ named_conf_content.content | b64decode | truncate(200) }}

    - name: Collect service facts
      ansible.builtin.service_facts:

    - name: Assert named service is enabled
      ansible.builtin.assert:
        that:
          - ansible_facts.services['named.service'].status == 'enabled'

    - name: Report named service active state (informational)
      ansible.builtin.debug:
        msg: >-
          named state={{ ansible_facts.services['named.service'].state }}
          (slave zones may not transfer without a running primary at 10.77.0.10).

---
# Map the shared Windows instance into the group the playbook targets and pick
# the mode under test.
all:
  children:
    all_windows:
      hosts:
        win2022:
          # report mode searches Windows Update and renders the HTML report,
          # which leaves a concrete artifact to assert on. The role's default
          # (install_all) would install every pending update and reboot —
          # tens of minutes on a fresh AMI, with nothing stable to verify
          # afterwards.
          win_patch_management_mode: report
          # The role's default report_dest is under C:\inetpub\wwwroot, which
          # only exists once IIS is installed. Keep the report in the
          # directory the role creates itself.
          win_patch_management_report_dest: 'C:\ansible_reports\win_patch_report.html'
          # The WUA search is slow on 2 vCPUs.
          molecule_aws_instance_type: t3.large

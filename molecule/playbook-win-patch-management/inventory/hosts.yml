---
# Map the shared Windows instance into the group the playbook targets and pick
# the mode under test.
all:
  children:
    all_windows:
      hosts:
        win2022:
          win_patch_management_mode: report
          # Restates the role default so verify.yml can reference the path.
          win_patch_management_report_dest: 'C:\ansible_reports\win_patch_report.html'
          # The WUA search is slow on 2 vCPUs.
          molecule_aws_instance_type: t3.large

---
# Map the shared Windows instance into the group the playbook targets, and
# name a package to install: the role's default package list is empty, which
# would leave only the Chocolatey bootstrap under test.
#
# The bootstrap and the package both download from the internet — the
# throwaway VPC create.yml builds has an internet gateway and a public IP, so
# egress works out of the box. 7zip.install is the installer package (it drops
# 7z.exe on disk) rather than the 7zip meta-package.
#
# win_chocolatey_version restates the role's own default. Role defaults are not
# visible outside the role, so verify.yml can only assert against the pinned
# version if the scenario states it here.
all:
  children:
    all_windows:
      hosts:
        win2022:
          win_chocolatey_version: "1.4.0"
          win_chocolatey_packages:
            - 7zip.install

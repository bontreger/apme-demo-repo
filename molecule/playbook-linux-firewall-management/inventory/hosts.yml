---
# rhel9 mapped into all_rhel (the playbook target). firewall_management_action
# is a role *default* (lowest precedence), so setting it here overrides the
# safe 'check' default and exercises the real 'start' path through the playbook.
#
# 'start' is connection-safe: firewalld's default zone permits ssh, and the
# established SSH connection survives the service start via conntrack (the AWS
# security group still guards port 22 either way).
all:
  children:
    molecule:
      hosts:
        rhel9:
          molecule_aws_ami_name: RHEL-9*HVM*x86_64*
    all_rhel:
      hosts:
        rhel9:
      vars:
        firewall_management_action: start

---
# localhost-only playbook — no EC2 guests. Drop the linux/windows inventory
# layers and skip create/destroy; the molecule controller is the test target.
ansible:
  executor:
    args:
      ansible_playbook:
        - --inventory=../utils/inventory/base/
        - --inventory=inventory/
  env:
    # community.crypto cert extensions can trip strict UTF-8 checks on newer ansible-core
    ANSIBLE_MODULE_STRICT_UTF8_RESPONSE: "0"

scenario:
  test_sequence:
    - dependency
    - syntax
    - converge
    - verify

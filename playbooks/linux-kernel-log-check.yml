# ============================================================================
# Playbook: Kernel Log Monitor
# ============================================================================
#
# Description:
#   Monitor kernel logs for critical errors, classify issues, and generate
#   diagnostic reports; optionally publish to an archive host (multi-play).
#
# Tags: pillar:ops,lifecycle:day2,maturity:l2,platform:linux,context:multi-play
#
# Supported OS:
#   RHEL/CentOS/Rocky/AlmaLinux/OracleLinux 7/8/9
#
# Author: Ansible Services Platform Team, Red Hat
# Version: 1.0.0
# Date: 2026-08-25
# License: Apache-2.0
#
# ============================================================================
---
- name: Monitor kernel logs for errors and generate reports
  hosts: all_rhel
  become: true
  gather_facts: true
  vars_files:
    - ../inventory/group_vars/all/reporting.yml
  pre_tasks:
    - name: Validate OS compatibility (RHEL/CentOS 7/8/9)
      ansible.builtin.assert:
        that:
          - ansible_facts['os_family'] == "RedHat"
          - ansible_facts['distribution'] in ["RedHat", "CentOS", "Rocky", "AlmaLinux", "OracleLinux"]
          - ansible_facts['distribution_major_version'] in ["7", "8", "9"]
        fail_msg: "Unsupported operating system."
        success_msg: "OS check passed: {{ ansible_facts['distribution'] }} {{ ansible_facts['distribution_major_version'] }}"
      tags: [always]
  roles:
    - role: kernel_log_monitor

- name: Publish reports to archive host
  ansible.builtin.import_playbook: ../roles/report_publish/playbooks/publish.yml
  vars:
    report_namespace: kernel_log_monitor
  when: (hostvars['localhost'].report_publish_enabled | default(false)) | bool

# ============================================================================
# Playbook: Deploy and Configure MariaDB Server
# ============================================================================
#
# Description:
#   Deploy and configure MariaDB server with security hardening, user
#   management, database creation, and initial backup. Includes OS
#   compatibility assertions, parameter validation, and robust error handling.
#
# Tags: pillar:db,lifecycle:day1,maturity:l2-process-oriented,platform:linux,tech:mariadb
#
# Supported OS:
#   RHEL/CentOS/Rocky/AlmaLinux/OracleLinux 7/8/9
#
# Author: Ansible Services Platform Team, Red Hat
# Version: 1.0.0
# Date: 2026-08-25
# License: Apache-2.0
#
# ============================================================================
---
- name: Deploy and configure MariaDB server
  hosts: "all_rhel"
  become: true
  gather_facts: true

  pre_tasks:
    - name: Validate OS compatibility (RHEL/CentOS 7/8/9)
      ansible.builtin.assert:
        that:
          - ansible_facts['os_family'] == "RedHat"
          - ansible_facts['distribution'] in ["RedHat", "CentOS", "Rocky", "AlmaLinux", "OracleLinux"]
          - ansible_facts['distribution_major_version'] in ["7", "8", "9"]
        fail_msg: "Unsupported operating system. This playbook is not available for the current OS."
        success_msg: "OS compatibility check passed: {{ ansible_facts['distribution'] }} {{ ansible_facts['distribution_major_version'] }}"
      tags: [always]

    - name: Display host information for debugging
      ansible.builtin.debug:
        msg:
          - "Host: {{ inventory_hostname }}"
          - "OS: {{ ansible_facts['distribution'] }} {{ ansible_facts['distribution_version'] }}"
          - "Major Version: {{ ansible_facts['distribution_major_version'] }}"
      tags: [debug, always]

  roles:
    - role: mariadb_server

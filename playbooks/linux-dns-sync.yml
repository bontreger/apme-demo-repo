# ============================================================================
# Playbook: Synchronize DNS Resolver Configuration
# ============================================================================
#
# Description:
#   Synchronize DNS resolver configuration (resolv.conf) from the control
#   node to RHEL targets using the dns_sync role.
#
# Tags: pillar:network,lifecycle:day2,maturity:l2-process-oriented,platform:linux,tech:bind
#
# Supported OS:
#   RHEL/CentOS/Rocky/AlmaLinux/OracleLinux 7/8/9
#
# Author: Ansible Services Platform Team, Red Hat
# Version: 1.0.0
# Date: 2026-08-25
# License: Apache-2.0
#
# ============================================================================
---
- name: Synchronize DNS configuration files across network
  hosts: all_rhel
  become: true
  gather_facts: true
  pre_tasks:
    - name: Validate OS compatibility (RHEL/CentOS 7/8/9)
      ansible.builtin.assert:
        that:
          - ansible_os_family == "RedHat"
          - ansible_distribution in ["RedHat", "CentOS", "Rocky", "AlmaLinux", "OracleLinux"]
          - ansible_distribution_major_version in ["7", "8", "9"]
        fail_msg: "Unsupported operating system."
        success_msg: "OS compatibility check passed: {{ ansible_distribution }} {{ ansible_distribution_major_version }}"
      tags: [always]
  roles:
    - role: dns_sync

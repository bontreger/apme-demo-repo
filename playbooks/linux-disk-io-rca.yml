# ============================================================================
# Playbook: Disk I/O Pressure Root Cause Analysis
# ============================================================================
#
# Description:
#   Investigate disk I/O pressure and generate JSON and plaintext RCA reports.
#
# Tags: pillar:ops,lifecycle:day2,maturity:l2-process-oriented,platform:linux
#
# Supported OS:
#   RHEL/CentOS/Rocky/AlmaLinux/OracleLinux 7/8/9/10
#
# Author: Ansible Services Platform Team, Red Hat
# Version: 1.0.0
# Date: 2026-08-27
# License: Apache-2.0
#
# ============================================================================
---
- name: Disk IO pressure root cause analysis
  hosts: all_rhel
  become: true
  gather_facts: true
  pre_tasks:
    - name: Validate OS compatibility
      ansible.builtin.assert:
        that:
          - ansible_os_family == "RedHat"
          - ansible_distribution_major_version in ["7", "8", "9", "10"]
        fail_msg: "Unsupported operating system."
      tags: [always]
  roles:
    - role: linux_diagnostic_rca
      vars:
        linux_diagnostic_rca_check_type: disk_io

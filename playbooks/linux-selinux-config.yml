# ============================================================================
# Playbook: Configure SELinux State
# ============================================================================
#
# Description:
#   Configure SELinux runtime mode and persistent state across RHEL targets
#   using the selinux_config role.
#
# Tags: pillar:security,lifecycle:day1,maturity:l2-process-oriented,platform:linux,tech:selinux
#
# Supported OS:
#   RHEL/CentOS/Rocky/AlmaLinux/OracleLinux 7/8/9
#
# Author: Ansible Services Platform Team, Red Hat
# Version: 1.0.0
# Date: 2026-08-25
# License: Apache-2.0
#
# ============================================================================
---
- name: Configure SELinux state across network
  hosts: all_rhel
  become: true
  gather_facts: true
  pre_tasks:
    - name: Validate OS compatibility (RHEL/CentOS 7/8/9)
      ansible.builtin.assert:
        that:
          - ansible_facts['os_family'] == "RedHat"
          - ansible_facts['distribution'] in ["RedHat", "CentOS", "Rocky", "AlmaLinux", "OracleLinux"]
          - ansible_facts['distribution_major_version'] in ["7", "8", "9"]
        fail_msg: "Unsupported operating system."
        success_msg: "OS compatibility check passed: {{ ansible_facts['distribution'] }} {{ ansible_facts['distribution_major_version'] }}"
      tags: [always]
  roles:
    - role: selinux_config

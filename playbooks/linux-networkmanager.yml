# ============================================================================
# Playbook: Manage NetworkManager Connections
# ============================================================================
#
# Description:
#   Manage NetworkManager connections and devices via nmcli, supporting view,
#   add, modify, activate/deactivate, and delete operations.
#
# Tags: pillar:network,lifecycle:day2,maturity:l2-process-oriented,platform:linux
#
# Supported OS:
#   RHEL/CentOS/Rocky/AlmaLinux/OracleLinux 7/8/9
#
# Author: Ansible Services Platform Team, Red Hat
# Version: 1.0.0
# Date: 2026-08-25
# License: Apache-2.0
#
# ============================================================================
---
- name: Manage NetworkManager connections and devices
  hosts: all_rhel
  become: true
  gather_facts: true
  pre_tasks:
    - name: Validate OS compatibility (RHEL/CentOS 7/8/9)
      ansible.builtin.assert:
        that:
          - ansible_facts['os_family'] == "RedHat"
          - ansible_facts['distribution'] in ["RedHat", "CentOS", "Rocky", "AlmaLinux", "OracleLinux"]
          - ansible_facts['distribution_major_version'] in ["7", "8", "9"]
        fail_msg: "Unsupported operating system."
        success_msg: "OS check passed: {{ ansible_facts['distribution'] }} {{ ansible_facts['distribution_major_version'] }}"
      tags: [always]

    - name: Construct NM connection list from survey
      ansible.builtin.set_fact:
        networkmanager_cli_nm_connections_to_add:
          - name: "{{ srv_nm_name }}"
            ifname: "{{ srv_nm_ifname }}"
            type: "ethernet"
            ip4: "{{ srv_nm_ip4 }}"
            gw4: "{{ srv_nm_gw4 | default(omit) }}"
            method: "manual"
        networkmanager_cli_nm_connections_to_activate: "{{ [srv_nm_name] if srv_nm_action | bool else [] }}"
      when: srv_nm_name is defined and srv_nm_name != ""
      tags: [always]
  roles:
    - role: networkmanager_cli
      tags: [view, add, modify, control, delete]

---
- name: Inspect critical Linux service status and generate reports
  hosts: "{{ survey_target_hosts | default('all_rhel') }}"
  become: true
  gather_facts: true
  vars_files:
    - ../inventory/group_vars/all/reporting.yml
  pre_tasks:
    - name: Validate OS compatibility (RHEL/CentOS 7/8/9)
      ansible.builtin.assert:
        that:
          - ansible_os_family == "RedHat"
          - ansible_distribution in ["RedHat", "CentOS", "Rocky", "AlmaLinux", "OracleLinux"]
          - ansible_distribution_major_version in ["7", "8", "9"]
        fail_msg: "Unsupported operating system."
        success_msg: "OS check passed: {{ ansible_distribution }} {{ ansible_distribution_major_version }}"
      tags: [always]
  roles:
    - role: service_check

- name: Publish reports to archive host
  ansible.builtin.import_playbook: ../roles/report_publish/playbooks/publish.yml
  vars:
    report_namespace: service_check
  when: (hostvars['localhost'].report_publish_enabled | default(false)) | bool

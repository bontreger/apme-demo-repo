# ============================================================================
# Playbook: SSH Connection Troubleshooting
# ============================================================================
#
# Description:
#   Diagnose SSH connectivity issues and apply auto-remediation using the
#   sshd_troubleshoot role.
#
# Tags: pillar:ops,lifecycle:day2,maturity:l2,platform:linux
#
# Supported OS:
#   RHEL/CentOS/Rocky/AlmaLinux/OracleLinux 7/8/9
#
# Author: Ansible Services Platform Team, Red Hat
# Version: 1.0.0
# Date: 2026-08-25
# License: Apache-2.0
#
# ============================================================================
---
- name: SSH connection troubleshooting and auto-remediation
  hosts: all_rhel
  become: true
  gather_facts: true

  pre_tasks:
    - name: Validate OS compatibility (RHEL/CentOS 7/8/9)
      ansible.builtin.assert:
        that:
          - ansible_facts['os_family'] == "RedHat"
          - ansible_facts['distribution'] in ["RedHat", "CentOS", "Rocky", "AlmaLinux", "OracleLinux"]
          - ansible_facts['distribution_major_version'] in ["7", "8", "9"]
        fail_msg: "Unsupported operating system. This playbook is not available for the current OS."
        success_msg: "OS compatibility check passed: {{ ansible_facts['distribution'] }} {{ ansible_facts['distribution_major_version'] }}"
      tags: [always]

  roles:
    - role: sshd_troubleshoot

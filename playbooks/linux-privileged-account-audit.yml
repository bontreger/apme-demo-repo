# ============================================================================
# Playbook: Privileged Account Security Audit
# ============================================================================
#
# Description:
#   Audit privileged accounts and sudo configuration; generate JSON and
#   plaintext reports; optionally publish to an archive host (multi-play).
#
# Tags: pillar:security,lifecycle:day2,maturity:l2-process-oriented,platform:linux,context:multi-play
#
# Supported OS:
#   RHEL/CentOS/Rocky/AlmaLinux/OracleLinux 7/8/9
#
# Author: Ansible Services Platform Team, Red Hat
# Version: 1.0.0
# Date: 2026-08-25
# License: Apache-2.0
#
# ============================================================================
---
- name: Privileged account and sudo security audit
  hosts: all_rhel
  become: true
  gather_facts: true
  vars_files:
    - ../inventory/group_vars/all/reporting.yml
  pre_tasks:
    - name: Validate OS compatibility
      ansible.builtin.assert:
        that:
          - ansible_facts['os_family'] == "RedHat"
          - ansible_facts['distribution_major_version'] in ["7", "8", "9"]
        fail_msg: "Unsupported operating system."
      tags: [always]
  roles:
    - role: linux_diagnostic_rca
      vars:
        linux_diagnostic_rca_check_type: privileged_account

- name: Publish reports to archive host
  ansible.builtin.import_playbook: ../roles/report_publish/playbooks/publish.yml
  vars:
    report_namespace: privileged_account_audit
  when: (hostvars['localhost'].report_publish_enabled | default(false)) | bool

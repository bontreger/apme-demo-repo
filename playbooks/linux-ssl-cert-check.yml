# ============================================================================
# Playbook: SSL Certificate Expiry Check and Report
# ============================================================================
#
# Description:
#   Check remote SSL/TLS certificate expiry on localhost and print a Markdown
#   report to the job log. A local file is written for CLI/Molecule convenience;
#   on AAP the execution environment is ephemeral.
#
# Tags: pillar:security,lifecycle:day2,maturity:l2-process-oriented,platform:linux,tech:ssl,context:localhost
#
# Supported OS:
#   Any (runs on controller localhost)
#
# Author: Ansible Services Platform Team, Red Hat
# Version: 1.0.0
# Date: 2026-08-27
# License: Apache-2.0
#
# ============================================================================
---
- name: SSL certificate expiry check and report
  hosts: localhost
  connection: local
  gather_facts: true
  roles:
    - role: ssl_cert_check

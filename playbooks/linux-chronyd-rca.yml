# ============================================================================
# Playbook: Chronyd Service Root Cause Analysis
# ============================================================================
#
# Description:
#   Diagnose chronyd NTP service faults and generate a plaintext RCA report;
#   optionally publish to an archive host (multi-play).
#
# Tags: pillar:ops,lifecycle:day2,maturity:l2-process-oriented,platform:linux,context:multi-play
#
# Supported OS:
#   RHEL/CentOS/Rocky/AlmaLinux/OracleLinux 7/8/9/10
#
# Author: Ansible Services Platform Team, Red Hat
# Version: 1.0.0
# Date: 2026-08-25
# License: Apache-2.0
#
# ============================================================================
---
- name: Chronyd service fault diagnosis
  hosts: all_rhel
  become: true
  gather_facts: true
  vars_files:
    - ../inventory/group_vars/all/reporting.yml

  pre_tasks:
    - name: Validate OS compatibility (RHEL/CentOS 7/8/9)
      ansible.builtin.assert:
        that:
          - ansible_os_family == "RedHat"
          - ansible_distribution in ["RedHat", "CentOS", "Rocky", "AlmaLinux", "OracleLinux"]
          - ansible_distribution_major_version in ["7", "8", "9", "10"]
        fail_msg: "Unsupported operating system. This playbook is not available for the current OS."
        quiet: true
      tags: [always]

  roles:
    - role: chronyd_rca

  post_tasks:
    - name: Read plaintext report for job output
      ansible.builtin.command: cat "{{ chronyd_rca_report_text_path }}"
      register: _chronyd_rca_report_output
      become: false
      changed_when: false

    - name: Output plaintext report for operators
      ansible.builtin.debug:
        msg: "{{ _chronyd_rca_report_output.stdout_lines }}"
      become: false

    - name: Remember report publishing settings for Play 2
      ansible.builtin.set_fact:
        report_source_hosts: "{{ ansible_play_hosts_all }}"
        report_publish_enabled: "{{ report_publish_enabled }}"
        report_text_path: "{{ chronyd_rca_report_text_path }}"
      run_once: true
      delegate_to: localhost
      delegate_facts: true

- name: Publish reports to archive host
  ansible.builtin.import_playbook: ../roles/report_publish/playbooks/publish.yml
  vars:
    report_generation_namespace: chronyd_rca
  when: (hostvars['localhost'].report_publish_enabled | default(false)) | bool

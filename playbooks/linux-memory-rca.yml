# ============================================================================
# Playbook: Memory Root Cause Analysis
# ============================================================================
#
# Description:
#   Diagnose high memory utilization or OOM events and generate a plaintext RCA
#   report.
#
# Tags: pillar:ops,lifecycle:day2,maturity:l2-process-oriented,platform:linux
#
# Supported OS:
#   RHEL/CentOS/Rocky/AlmaLinux/OracleLinux 7/8/9/10
#
# Author: Ansible Services Platform Team, Red Hat
# Version: 1.0.0
# Date: 2026-08-27
# License: Apache-2.0
#
# ============================================================================
---
- name: Memory diagnosis (high utilization / OOM)
  hosts: all_rhel
  become: true
  gather_facts: true

  pre_tasks:
    - name: Validate OS compatibility (RHEL 7/8/9/10)
      ansible.builtin.assert:
        that:
          - ansible_os_family == "RedHat"
          - ansible_distribution in ["RedHat", "CentOS", "Rocky", "AlmaLinux", "OracleLinux"]
          - ansible_distribution_major_version in ["7", "8", "9", "10"]
        fail_msg: "Unsupported operating system. This playbook is not available for the current OS."
        quiet: true
      tags: [always]

  roles:
    - role: memory_rca

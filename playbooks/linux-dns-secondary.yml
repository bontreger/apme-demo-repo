# ============================================================================
# Playbook: Deploy and Configure BIND Secondary DNS
# ============================================================================
#
# Description:
#   Deploy and configure a BIND secondary (slave) DNS server.
#   Secondary does not need zone files; they transfer from primary.
#
# Tags: pillar:network,lifecycle:day1,maturity:l2,platform:linux,tech:bind
#
# Supported OS:
#   RHEL/CentOS/Rocky/AlmaLinux/OracleLinux 7/8/9
#
# Author: Ansible Services Platform Team, Red Hat
# Version: 1.0.0
# Date: 2026-08-25
# License: Apache-2.0
#
# ============================================================================
---
- name: Deploy and configure BIND secondary DNS servers
  hosts: secondary_dns
  become: true
  gather_facts: true

  pre_tasks:
    - name: Validate OS compatibility (RHEL/CentOS 7/8/9)
      ansible.builtin.assert:
        that:
          - ansible_os_family == "RedHat"
          - ansible_distribution in ["RedHat", "CentOS", "Rocky", "AlmaLinux", "OracleLinux"]
          - ansible_distribution_major_version in ["7", "8", "9"]
        fail_msg: "Unsupported operating system. This playbook is not available for the current OS."
        success_msg: "OS compatibility check passed: {{ ansible_distribution }} {{ ansible_distribution_major_version }}"
      tags: [always]

    - name: Show host facts for debugging
      ansible.builtin.debug:
        msg:
          - "Host: {{ inventory_hostname }}"
          - "OS: {{ ansible_distribution }} {{ ansible_distribution_version }}"
      tags: [debug, always]

  roles:
    - role: bind_secondary_dns

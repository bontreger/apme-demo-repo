# ============================================================================
# Playbook: Configure DHCP client
# ============================================================================
#
# Description:
#   Configure DHCP client using redhat.rhel_system_roles.network.
#   This is the Red Hat recommended standardized, cross-version network
#   configuration method for Linux service automation.
#
# Tags: pillar:network,lifecycle:day2,maturity:l2,platform:linux,tech:dhcp
#
# Supported OS:
#   RHEL/CentOS/Rocky/AlmaLinux/OracleLinux 7/8/9
#
# Author: Ansible Services Platform Team, Red Hat
# Version: 1.0.0
# Date: 2026-08-25
# License: Apache-2.0
#
# ============================================================================
---
- name: Configure DHCP client
  hosts: dhcp_clients
  become: true
  gather_facts: true

  pre_tasks:
    - name: Validate OS compatibility (RHEL/CentOS 7/8/9)
      ansible.builtin.assert:
        that:
          - ansible_os_family == "RedHat"
          - ansible_distribution in ["RedHat", "CentOS", "Rocky", "AlmaLinux", "OracleLinux"]
          - ansible_distribution_major_version in ["7", "8", "9"]
        fail_msg: "Unsupported operating system. This playbook is not available for the current OS."
        success_msg: "OS compatibility check passed: {{ ansible_distribution }} {{ ansible_distribution_major_version }}"
      tags: [always]

    - name: Display host information for debugging
      ansible.builtin.debug:
        msg:
          - "Host: {{ inventory_hostname }}"
          - "OS: {{ ansible_distribution }} {{ ansible_distribution_version }}"
          - "Primary interface: {{ ansible_default_ipv4.interface | default('unknown') }}"
      tags: [debug, always]

    - name: Default interface name to primary IPv4 NIC when not supplied
      ansible.builtin.set_fact:
        dhcp_client_interface_name: "{{ ansible_default_ipv4.interface }}"
      when:
        - network_connections is not defined
        - dhcp_client_interface_name is not defined
        - ansible_default_ipv4.interface is defined

    - name: Build network_connections from dhcp_client_interface_name
      ansible.builtin.set_fact:
        network_connections:
          - name: "{{ dhcp_client_connection_name | default('dhcp-connection') }}"
            interface_name: "{{ dhcp_client_interface_name }}"
            type: ethernet
            ip:
              dhcp4: true
              auto6: true
            state: up
      when:
        - network_connections is not defined
        - dhcp_client_interface_name is defined

    - name: Assert network connection variables are defined
      ansible.builtin.assert:
        that:
          - network_connections is defined
        fail_msg: >-
          Supply network_connections or dhcp_client_interface_name
          (for example eth0 or ens5).
      tags: [always]

  roles:
    - redhat.rhel_system_roles.network

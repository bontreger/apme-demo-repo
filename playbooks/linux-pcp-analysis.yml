# ============================================================================
# Playbook: PCP Performance Analysis and Report
# ============================================================================
#
# Description:
#   Install PCP on RHEL targets, collect performance metrics, and write a
#   per-host report on pcp_servers (also printed in the job log).
#
# Tags: pillar:ops,lifecycle:day2,maturity:l2-process-oriented,platform:linux,tech:pcp,context:multi-play
#
# Supported OS:
#   RHEL/CentOS/Rocky/AlmaLinux/OracleLinux 7/8/9/10
#
# Author: Ansible Services Platform Team, Red Hat
# Version: 1.0.0
# Date: 2026-08-27
# License: Apache-2.0
#
# ============================================================================
---
- name: Install and configure PCP
  hosts: all_rhel
  become: true
  gather_facts: true
  pre_tasks:
    - name: Validate OS compatibility (RHEL 7/8/9/10)
      ansible.builtin.assert:
        that:
          - ansible_os_family == "RedHat"
          - ansible_distribution in ["RedHat", "CentOS", "Rocky", "AlmaLinux", "OracleLinux"]
          - ansible_distribution_major_version in ["7", "8", "9", "10"]
        fail_msg: "Unsupported operating system. This playbook is not available for the current OS."
        success_msg: "OS compatibility check passed: {{ ansible_distribution }} {{ ansible_distribution_major_version }}"
      tags: [always]
  roles:
    - role: pcp_analysis

- name: Collect PCP performance data and write report
  hosts: pcp_servers
  become: true
  gather_facts: true
  tasks:
    - name: Run PCP data collection
      ansible.builtin.include_role:
        name: pcp_analysis
        tasks_from: collect.yml

    - name: Generate PCP performance report
      ansible.builtin.include_role:
        name: pcp_analysis
        tasks_from: report.yml

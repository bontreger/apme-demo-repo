# ============================================================================
# Playbook: Deploy and Configure NFS Server
# ============================================================================
#
# Description:
#   Deploy and configure an NFS server with exports, service management, and
#   optional firewalld rules using the nfs_server role.
#
# Tags: pillar:os,lifecycle:day1,maturity:l2,platform:linux,tech:nfs
#
# Supported OS:
#   RHEL/CentOS/Rocky/AlmaLinux/OracleLinux 7/8/9
#
# Author: Ansible Services Platform Team, Red Hat
# Version: 1.0.0
# Date: 2026-08-25
# License: Apache-2.0
#
# ============================================================================
---
- name: Deploy and configure NFS server
  hosts: all_rhel
  become: true
  gather_facts: true

  pre_tasks:
    - name: Validate OS compatibility (RHEL/CentOS 7/8/9)
      ansible.builtin.assert:
        that:
          - ansible_os_family == "RedHat"
          - ansible_distribution in ["RedHat", "CentOS", "Rocky", "AlmaLinux", "OracleLinux"]
          - ansible_distribution_major_version in ["7", "8", "9"]
        fail_msg: "Unsupported operating system. This playbook is not available for the current OS."
        success_msg: "OS compatibility check passed: {{ ansible_distribution }} {{ ansible_distribution_major_version }}"
      tags: [always]

  roles:
    - role: nfs_server

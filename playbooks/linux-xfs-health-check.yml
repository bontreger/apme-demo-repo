# ============================================================================
# Playbook: XFS Filesystem Health Check
# ============================================================================
#
# Description:
#   Inspect XFS filesystem metadata consistency and generate a diagnostic
#   report.
#
# Tags: pillar:ops,lifecycle:day2,maturity:l2-process-oriented,platform:linux
#
# Supported OS:
#   RHEL/CentOS/Rocky/AlmaLinux/OracleLinux 7/8/9/10
#
# Author: Ansible Services Platform Team, Red Hat
# Version: 1.0.0
# Date: 2026-08-27
# License: Apache-2.0
#
# ============================================================================
---
- name: XFS filesystem health inspection
  hosts: all_rhel
  become: true
  gather_facts: true
  pre_tasks:
    - name: Validate OS compatibility
      ansible.builtin.assert:
        that:
          - ansible_facts['os_family'] == "RedHat"
          - ansible_facts['distribution_major_version'] in ["7", "8", "9", "10"]
        fail_msg: "Unsupported operating system."
      tags: [always]
  roles:
    - role: xfs_health_check
